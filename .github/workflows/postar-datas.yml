name: Publicar data comemorativa
run-name: "Data comemorativa ${{ inputs.data || 'de hoje' }}"

# Vai em .github/workflows/ do repositório gustavobailly-92/hubmaison-comparador-ativos, com a pasta
# datas-comemorativas/ na raiz da main. Todo dia às 7h40 (Brasília) vê se a data do dia está em
# datas-comemorativas/aprovados.json; se estiver, renderiza, grava na branch posts em
# AAAA-MM-DD/DATA-slug e publica pelo mesmo instagram/postar.py dos resultados da B3.
on:
  schedule:
    - cron: "40 10 * * *"   # 10:40 UTC = 07:40 em Brasília
  push:
    branches: [main]
    paths:
      - "datas-comemorativas/aprovados.json"   # aprovar uma data do dia publica na hora, sem esperar o dia seguinte
  workflow_dispatch:
    inputs:
      data:
        description: "Data a publicar (AAAA-MM-DD). Vazio = hoje."
        required: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: posts
          path: posts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hoje tem data aprovada?
        id: hoje
        run: python datas-comemorativas/hoje.py "${{ inputs.data }}" >> "$GITHUB_OUTPUT"
      - name: Já publicado?
        id: feito
        if: steps.hoje.outputs.slug != ''
        run: |
          if [ -f "posts/${{ steps.hoje.outputs.pasta }}/publicado.json" ]; then echo "sim=1" >> "$GITHUB_OUTPUT"; echo "já publicado"; fi
      - name: Renderizar
        if: steps.hoje.outputs.slug != '' && steps.feito.outputs.sim != '1'
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
          cd datas-comemorativas
          python render.py --de "${{ steps.hoje.outputs.data }}" --ate "${{ steps.hoje.outputs.data }}" --so "${{ steps.hoje.outputs.slug }}"
      - name: Gravar na branch posts
        if: steps.hoje.outputs.slug != '' && steps.feito.outputs.sim != '1'
        env:
          PASTA: ${{ steps.hoje.outputs.pasta }}
        run: |
          mkdir -p "posts/$PASTA"
          cp datas-comemorativas/saida/$PASTA/[0-9][0-9].jpg datas-comemorativas/saida/$PASTA/legenda.txt "posts/$PASTA/"
          cd posts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PASTA"
          git commit -m "data comemorativa: $PASTA"
          git push origin HEAD:posts
          sleep 20   # dá tempo do raw.githubusercontent.com servir as imagens novas
      - name: Publicar
        if: steps.hoje.outputs.slug != '' && steps.feito.outputs.sim != '1'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          REPO: ${{ github.repository }}
        run: python instagram/postar.py "${{ steps.hoje.outputs.pasta }}"
      - name: Registrar a publicação
        if: steps.hoje.outputs.slug != '' && steps.feito.outputs.sim != '1'
        env:
          PASTA: ${{ steps.hoje.outputs.pasta }}
        run: |
          cd posts
          git add "$PASTA/publicado.json"
          git commit -m "publicado: $PASTA"
          git push origin HEAD:posts
