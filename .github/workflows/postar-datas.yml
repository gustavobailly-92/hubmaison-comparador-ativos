name: Publicar data comemorativa
run-name: "Data comemorativa ${{ inputs.data || 'de hoje' }}"

# Fica em .github/workflows/ do hubmaison-comparador-ativos, com a pasta datas-comemorativas/ na main.
# Roda às 7h40, 11h40 e 16h40 (Brasília) e sempre que aprovados.json muda. Publica toda data aprovada do
# dia cujo horário já chegou (calendario.json, campo horario; padrão 07:40), uma de cada vez: renderiza,
# grava em posts/AAAA-MM-DD/DATA-slug e publica pelo instagram/postar.py. Pasta com publicado.json é pulada.
on:
  schedule:
    - cron: "40 10 * * *"   # 07:40 em Brasília
    - cron: "40 14 * * *"   # 11:40 em Brasília (segundo post do dia, quando houver)
    - cron: "40 19 * * *"   # 16:40 em Brasília (terceiro post do dia: Corretor de Seguros, em 12/10)
  push:
    branches: [main]
    paths:
      - "datas-comemorativas/aprovados.json"
  workflow_dispatch:
    inputs:
      data:
        description: "Data a publicar (AAAA-MM-DD). Vazio = agora."
        required: false

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: posts
          path: posts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: O que sai agora?
        id: hoje
        run: python datas-comemorativas/hoje.py "${{ inputs.data }}" >> "$GITHUB_OUTPUT"
      - name: Preparar o render
        if: steps.hoje.outputs.lista != ''
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Renderizar, gravar e publicar
        if: steps.hoje.outputs.lista != ''
        env:
          LISTA: ${{ steps.hoje.outputs.lista }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          REPO: ${{ github.repository }}
        run: |
          git -C posts config user.name "github-actions[bot]"
          git -C posts config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for PASTA in $LISTA; do
            if [ -f "posts/$PASTA/publicado.json" ]; then echo "$PASTA já publicado"; continue; fi
            DATA="${PASTA%%/*}"; SLUG="${PASTA#*/DATA-}"
            (cd datas-comemorativas && python render.py --de "$DATA" --ate "$DATA" --so "$SLUG")
            mkdir -p "posts/$PASTA"
            cp datas-comemorativas/saida/$PASTA/[0-9][0-9].jpg datas-comemorativas/saida/$PASTA/legenda.txt "posts/$PASTA/"
            git -C posts add "$PASTA" && git -C posts commit -q -m "data comemorativa: $PASTA" && git -C posts push -q origin HEAD:posts
            sleep 20   # tempo para o raw.githubusercontent.com servir as imagens novas
            python instagram/postar.py "$PASTA"
            git -C posts add "$PASTA/publicado.json" && git -C posts commit -q -m "publicado: $PASTA" && git -C posts push -q origin HEAD:posts
            sleep 60   # intervalo entre dois posts do mesmo dia
          done
