name: Publicar no Instagram
run-name: "Instagram: ${{ inputs.pasta }}"

# Disparado à mão (ou pelo Claude, depois do ok do Gustavo na conversa) para um carrossel pendente já aprovado. O que a
# regra de 10/11/2026 permite sai sozinho pelo gerar-posts.yml (instagram/auto.py).
# O carrossel fica na branch posts, em AAAA-MM-DD/TICKER-PERIODO (01.jpg ... e legenda.txt).
on:
  workflow_dispatch:
    inputs:
      pasta:
        description: "Pasta do carrossel aprovado na branch posts (ex.: 2026-11-12/PETR4-3T26)"
        required: true

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: posts
          path: posts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          REPO: ${{ github.repository }}
          PASTA: ${{ inputs.pasta }}
        run: python instagram/postar.py "$PASTA"
      - name: Registrar a publicação na branch posts
        env:
          PASTA: ${{ inputs.pasta }}
        run: |
          cd posts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PASTA/publicado.json"
          git commit -m "publicado: $PASTA"
          git push origin HEAD:posts
