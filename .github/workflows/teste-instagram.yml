name: Teste do token do Instagram (só leitura)

# Branch de teste: confere o token e a conta sem publicar nada. Não imprime o token.
on:
  workflow_dispatch:
  push:
    branches: [teste-instagram]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir token e conta
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          tok = os.environ.get("IG_ACCESS_TOKEN", "").strip()
          uid = os.environ.get("IG_USER_ID", "").strip()
          print("IG_USER_ID definido:", bool(uid), "| valor:", uid)
          print("IG_ACCESS_TOKEN definido:", bool(tok), "| tamanho:", len(tok), "| prefixo:", tok[:4])
          def get(url, **q):
              q["access_token"] = tok
              try:
                  with urllib.request.urlopen(url + "?" + urllib.parse.urlencode(q), timeout=30) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")
          H = "https://graph.facebook.com/v27.0"
          alvo = uid or "17841400294654371"
          st, me = get(H + "/me", fields="id,name")
          print("/me ->", st, me)
          st, pe = get(H + "/me/permissions")
          print("permissões ->", st, [(x.get("permission"), x.get("status")) for x in pe.get("data", [])] or pe)
          st, u = get(f"{H}/{alvo}", fields="username,name,media_count")
          print(f"/{alvo} ->", st, u)
          st, lim = get(f"{H}/{alvo}/content_publishing_limit", fields="quota_usage,config")
          print("limite de publicação ->", st, lim)
          PY
