name: Teste da correção do lucro

# Só nesta branch de desenvolvimento; sai antes do merge.
on:
  push:
    branches: [corrige-lucro]
    paths: ["pipeline/**", "sondagem/teste_lucro.py", ".github/workflows/teste-lucro.yml"]

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas numpy pillow
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: cvm-informes-teste-${{ github.run_id }}
          restore-keys: |
            cvm-informes-
      - run: |
          set -o pipefail
          python sondagem/teste_lucro.py 2>&1 | tee sondagem/log_lucro.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sondagem/*.txt || true
          git commit -m "teste lucro: execução ${{ github.run_id }}" || echo "nada a gravar"
          git push origin HEAD:corrige-lucro
