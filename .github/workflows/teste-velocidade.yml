name: Teste de velocidade do RAD

# Só nesta branch de desenvolvimento; sai antes do merge.
on:
  push:
    branches: [rad-rapido]
    paths: ["pipeline/rad.py", "sondagem/teste_velocidade.py", ".github/workflows/teste-velocidade.yml"]

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: resultados
          path: res
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sondagem/teste_velocidade.py 2>&1 | tee sondagem/log_velocidade.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sondagem/teste_velocidade.txt sondagem/log_velocidade.txt || true
          git commit -m "teste de velocidade: execução ${{ github.run_id }}" || echo "nada a gravar"
          git push origin HEAD:rad-rapido
