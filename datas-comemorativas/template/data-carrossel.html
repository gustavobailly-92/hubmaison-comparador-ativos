<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Datas que importam · Maison Invest</title>
<style>
/*FONTES*/
:root{
  --azul:#293654; --azul-medio:#3f5477; --azul-claro:#93acc6; --azul-suave:#b2cbe6;
  --fundo:#1f2a43; --fundo-2:#17203a; --ouro:#c6a15b; --branco:#ffffff;
  --fonte:"Gotham","Montserrat",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e1424;font-family:var(--fonte);color:var(--branco);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;
  background:
    radial-gradient(120% 80% at 85% 0%, rgba(63,84,119,.55) 0%, rgba(63,84,119,0) 60%),
    linear-gradient(180deg,var(--azul) 0%,var(--fundo) 55%,var(--fundo-2) 100%);
  padding:84px 88px 0}
.slide::after{content:"";position:absolute;inset:36px;border:1px solid rgba(198,161,91,.22);pointer-events:none}

.topo{position:relative;z-index:2;display:flex;justify-content:flex-end;align-items:center;
  font-size:19px;letter-spacing:.24em;text-transform:uppercase;color:var(--azul-claro);font-weight:500}
.topo .data{color:var(--ouro)}
.rodape{position:absolute;left:88px;right:88px;bottom:78px;display:flex;justify-content:space-between;align-items:flex-end;z-index:2}
.rodape img{width:280px;height:auto;display:block}
.rodape .pag{font-size:18px;letter-spacing:.2em;color:var(--azul-claro)}
.deslize{font-size:18px;letter-spacing:.24em;text-transform:uppercase;color:var(--azul-claro);display:flex;align-items:center;gap:14px}
.deslize i{display:block;width:10px;height:10px;border-top:1.5px solid var(--ouro);border-right:1.5px solid var(--ouro);transform:rotate(45deg);margin-left:2px}
.fonte{position:absolute;left:88px;right:88px;bottom:176px;font-size:16px;line-height:1.5;color:rgba(178,203,230,.62);
  border-top:1px solid rgba(147,172,198,.18);padding-top:20px;z-index:2}
.fio{width:72px;height:2px;background:var(--ouro);margin-top:40px}
.rot{font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:var(--ouro);font-weight:600}

/* capa */
.numeral{position:absolute;right:52px;top:96px;font-weight:300;font-size:600px;line-height:.8;letter-spacing:-.04em;
  background:linear-gradient(180deg,rgba(178,203,230,.20) 0%,rgba(147,172,198,.03) 100%);-webkit-background-clip:text;background-clip:text;
  color:transparent;font-variant-numeric:tabular-nums;z-index:1;user-select:none}
.capa-corpo{position:absolute;left:88px;right:88px;bottom:250px;z-index:2}
.capa-corpo .ic{width:104px;height:104px;display:block}
.capa-corpo .mes{margin-top:34px;font-size:22px;letter-spacing:.26em;text-transform:uppercase;color:var(--azul-claro);font-weight:500}
.capa-corpo h1{font-weight:700;font-size:84px;line-height:1.04;letter-spacing:-.015em;margin-top:40px;max-width:900px}
.capa-corpo .frase{font-weight:400;font-size:34px;line-height:1.42;color:var(--azul-suave);margin-top:30px;max-width:860px}

/* miolo */
.miolo h1{font-weight:700;font-size:58px;line-height:1.1;letter-spacing:-.01em;margin-top:22px;max-width:900px}
.miolo .cab{margin-top:96px}
.itens{margin-top:56px}
.item{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:38px 0;border-top:1px solid rgba(147,172,198,.18)}
.item:last-child{border-bottom:1px solid rgba(147,172,198,.18)}
.item .n{font-weight:300;font-size:64px;line-height:1;color:var(--ouro);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.item b{display:block;font-size:34px;font-weight:700;line-height:1.2}
.item p{font-size:26px;line-height:1.45;color:var(--azul-suave);margin-top:12px;max-width:760px}
.texto-longo{font-size:38px;line-height:1.55;color:var(--azul-suave);margin-top:48px;max-width:860px;font-weight:400}
.texto-longo::first-line{color:var(--branco)}
.marca{position:absolute;left:80px;bottom:150px;font-weight:300;font-size:330px;line-height:.8;letter-spacing:-.04em;
  background:linear-gradient(180deg,rgba(178,203,230,.18) 0%,rgba(147,172,198,.03) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;z-index:1}
.ic-mini{position:absolute;right:88px;top:170px;width:84px;height:84px;opacity:.9;z-index:2}
.numeros{margin-top:70px}
.numeros .lin{display:flex;align-items:baseline;justify-content:space-between;padding:34px 0;border-top:1px solid rgba(147,172,198,.18)}
.numeros .lin:last-child{border-bottom:1px solid rgba(147,172,198,.18)}
.numeros .v{font-weight:300;font-size:150px;line-height:1;color:var(--ouro);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.numeros .r{font-size:28px;letter-spacing:.2em;text-transform:uppercase;color:var(--azul-claro);font-weight:500}

/* fechamento */
.fecha h1{margin-top:170px;font-weight:700;font-size:66px;line-height:1.08;max-width:860px}
.fecha .sub{font-weight:400;font-size:32px;line-height:1.45;color:var(--azul-suave);margin-top:32px;max-width:840px}
.cta{margin-top:72px;padding-top:44px;border-top:1px solid rgba(147,172,198,.18);max-width:860px}
.cta .r{font-size:18px;letter-spacing:.26em;text-transform:uppercase;color:var(--ouro);font-weight:600}
.cta .c{font-size:34px;line-height:1.35;font-weight:600;margin-top:16px;max-width:820px}
.cta .d{display:inline-block;margin-top:30px;padding:16px 28px;border:1px solid rgba(198,161,91,.6);font-size:24px;font-weight:500;letter-spacing:.02em;color:var(--branco)}
.fecha.sem-cta{position:absolute;left:88px;right:88px;bottom:420px}
.fecha.sem-cta h1{margin-top:0}
.fecha.sem-cta.sobrio{bottom:360px}
.lema{position:absolute;left:88px;right:88px;bottom:300px;font-size:22px;line-height:1.6;letter-spacing:.02em;color:var(--azul-suave);font-weight:400}
.lema b{color:var(--ouro);font-weight:600}
.ident{position:absolute;left:88px;right:88px;bottom:190px;font-size:16px;line-height:1.5;color:rgba(178,203,230,.62);
  border-top:1px solid rgba(147,172,198,.18);padding-top:20px}

/* card para WhatsApp */
.card{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:0}
.card .numeral{right:auto;left:50%;transform:translateX(-50%);top:110px;font-size:500px}
.card .ic{width:112px;height:112px;margin-top:560px;position:relative;z-index:2}
.card .mes{margin-top:40px;font-size:22px;letter-spacing:.26em;text-transform:uppercase;color:var(--azul-claro);position:relative;z-index:2}
.card h1{position:relative;z-index:2;font-weight:700;font-size:80px;line-height:1.05;margin-top:18px;max-width:860px}
.card .frase{position:relative;z-index:2;font-size:32px;line-height:1.45;color:var(--azul-suave);margin-top:34px;max-width:800px}
.card .lema{text-align:center;bottom:220px}
.card .rodape{justify-content:center}
</style>
</head>
<body>
<div id="raiz"></div>
<script>
const D = /*DADOS*/null;
const LOGO = "/*LOGO*/";
const G = 'fill="none" stroke="#c6a15b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"';
const ICONES = {
  casa:`<path d="M7 23 24 9l17 14"/><path d="M12 19v21h24V19"/><path d="M21 40V30h6v10"/><path d="M33 13V8h3v8"/>`,
  estrela:`<path d="M24 6l4.6 12.2L41 19l-9.6 8 3.2 12.6L24 32.6l-10.6 7 3.2-12.6L7 19l12.4-.8z"/><path d="M24 2v1.5M24 44.5V46M3 24h1.5M43.5 24H45"/>`,
  ampulheta:`<path d="M15 6h18M15 42h18"/><path d="M17 6c0 9 14 11 14 18s-14 9-14 18"/><path d="M31 6c0 9-14 11-14 18s14 9 14 18"/><path d="M20 38c1.5-2.5 6.5-2.5 8 0"/>`,
  horizonte:`<path d="M5 34h38M11 40h26"/><path d="M14 34a10 10 0 0 1 20 0"/><path d="M24 13v5M12.6 18.6l3.2 3.2M35.4 18.6l-3.2 3.2M7 27h4M37 27h4"/>`,
  ramo:`<path d="M13 43C18 31 25 19 35 6"/><path d="M19 32c-6 .5-9.5-2-11-5.5 5-1.5 9 .5 11 5.5z"/><path d="M19.5 31c-1-6 1.5-9.5 5-11 1.5 5-.5 9-5 11z"/><path d="M24.5 22.5c-6 .5-9.5-2-11-5.5 5-1.5 9 .5 11 5.5z"/><path d="M25.5 21.5c-1-6 1.5-9.5 5-11 1.5 5-.5 9-5 11z"/><path d="M30 13.5c-5 0-8-2-9-5 4-1 7.5.5 9 5z"/>`,
  balanca:`<path d="M24 8v32M15 40h18M9 14h30"/><circle cx="24" cy="8" r="2"/><path d="M9 14 4 27a5 5 0 0 0 10 0z"/><path d="M39 14l-5 13a5 5 0 0 0 10 0z"/>`,
  flor:`<circle cx="24" cy="17" r="3.2"/><path d="M24 13.8c-2.5-4-1.5-8 0-9.8 1.5 1.8 2.5 5.8 0 9.8zM27.2 17c4-2.5 8-1.5 9.8 0-1.8 1.5-5.8 2.5-9.8 0zM24 20.2c2.5 4 1.5 8 0 9.8-1.5-1.8-2.5-5.8 0-9.8zM20.8 17c-4 2.5-8 1.5-9.8 0 1.8-1.5 5.8-2.5 9.8 0z"/><path d="M24 30v14"/><path d="M24 38c-4-.5-7-3-8-7 4 0 7 2.5 8 7z"/>`,
  aneis:`<circle cx="18.5" cy="28" r="10.5"/><circle cx="29.5" cy="28" r="10.5"/><path d="M15 14.5l3.5-4.5 3.5 4.5-3.5 2z"/>`,
  arvore:`<path d="M24 43V25"/><path d="M24 31l-6-5M24 28l6-6"/><path d="M24 5a10 10 0 0 1 10 10 8 8 0 0 1-3 15.5H17A8 8 0 0 1 14 15 10 10 0 0 1 24 5z"/><path d="M17 43h14"/>`,
  bussola:`<circle cx="24" cy="24" r="17"/><path d="M24 11l4 13-4 13-4-13z"/><circle cx="24" cy="24" r="1.6"/><path d="M24 4v3M24 41v3M4 24h3M41 24h3"/>`,
  chave:`<circle cx="15" cy="24" r="7.5"/><circle cx="15" cy="24" r="2.2"/><path d="M22.5 24H43M37 24v6M42 24v4"/>`,
  escudo:`<path d="M24 5l15 5.5V22c0 10-6.5 17-15 21-8.5-4-15-11-15-21V10.5z"/><path d="M17 24l5 5 9-10"/>`,
  pipa:`<path d="M24 4 36 18 24 34 12 18z"/><path d="M12 18h24M24 4v30"/><path d="M24 34c-2.5 3 2.5 4 0 7s2.5 3.5 1 6"/><path d="M21.5 39.5l-2.5-1.5v3zM26 43.5l2.5-1.5v3z"/>`,
  broto:`<path d="M9 41h30"/><path d="M24 41V24"/><path d="M24 29c-8 0-11.5-5-11.5-11.5 7.5 0 11.5 4.5 11.5 11.5z"/><path d="M24 25c0-7.5 4-12.5 12-12.5 0 7.5-4 12.5-12 12.5z"/>`,
  coluna:`<path d="M9 10l2.5-4h25L39 10z"/><path d="M11 10h26v4H11z"/><path d="M15 14v22M21 14v22M27 14v22M33 14v22"/><path d="M11 36h26v3H11zM8 39h32v3H8z"/>`,
  chama:`<path d="M24 5c3 7 11 11 11 21a11 11 0 0 1-22 0c0-5 3-9 6-11 0 4 2 7 5 7 0-6-2-10 0-17z"/><path d="M24 37a4 4 0 0 1-4-4c0-3 4-6 4-6s4 3 4 6a4 4 0 0 1-4 4z"/>`,
  trigo:`<path d="M24 44V8"/><path d="M24 16c-4-1-6.5-4-6.5-8 4 1 6.5 4 6.5 8zM24 16c4-1 6.5-4 6.5-8-4 1-6.5 4-6.5 8zM24 24c-4-1-6.5-4-6.5-8 4 1 6.5 4 6.5 8zM24 24c4-1 6.5-4 6.5-8-4 1-6.5 4-6.5 8zM24 32c-4-1-6.5-4-6.5-8 4 1 6.5 4 6.5 8zM24 32c4-1 6.5-4 6.5-8-4 1-6.5 4-6.5 8z"/>`,
  globo:`<circle cx="24" cy="24" r="17"/><path d="M7 24h34M24 7c-6.5 5-6.5 29 0 34M24 7c6.5 5 6.5 29 0 34M10 15.5h28M10 32.5h28"/>`,
  arco:`<path d="M6 11h36M9 7h30M9 11v31M39 11v31M9 17h30"/><path d="M16 42V31a8 8 0 0 1 16 0v11"/><path d="M5 42h38"/>`,
  elo:`<path d="M21 29.5l-4.5 4.5a6.4 6.4 0 0 1-9-9l7.5-7.5a6.4 6.4 0 0 1 9 0"/><path d="M27 18.5l4.5-4.5a6.4 6.4 0 0 1 9 9L33 30.5a6.4 6.4 0 0 1-9 0"/><path d="M19.5 28.5l9-9"/>`,
  cruz:`<path d="M24 5v38M15 15h18"/><path d="M17 43h14"/>`,
  triangulo:`<path d="M24 7 42 39H6z"/><path d="M24 21l7.5 13h-15z"/>`,
  maleta:`<path d="M7 16h34v23H7z"/><path d="M18 16v-4.5h12V16"/><path d="M7 25.5h34"/><path d="M21.5 23v5h5v-5"/>`,
  vela:`<path d="M19 22h10v19H19z"/><path d="M24 22v-3"/><path d="M24 18.5c-3-2.5-3-6 0-11 3 5 3 8.5 0 11z"/><path d="M14 41h20"/>`,
  bandeira:`<path d="M12 44V5"/><path d="M12 7h25l-5.5 7 5.5 7H12"/><path d="M8 44h8"/>`,
  mascara:`<path d="M5 15c6-3.5 13-3.5 19 1 6-4.5 13-4.5 19-1 0 11-4.5 17-10.5 17-4 0-6.5-3-8.5-5.5-2 2.5-4.5 5.5-8.5 5.5C9.5 32 5 26 5 15z"/><path d="M12 21.5c2-1.5 4.5-1.5 6.5 0M29.5 21.5c2-1.5 4.5-1.5 6.5 0"/><path d="M24 32v11"/>`,
  coroa:`<path d="M9 35 6 15l10 8 8-13 8 13 10-8-3 20z"/><path d="M9 40h30"/><circle cx="24" cy="7" r="1.6"/>`,
  lanterna:`<path d="M17 12h14l4 7v11l-4 6H17l-4-6V19z"/><path d="M13 24h22M24 5v7M24 36v6M20 43h8"/>`,
  trevo:`<circle cx="18" cy="18" r="6"/><circle cx="30" cy="18" r="6"/><circle cx="24" cy="28" r="6"/><path d="M24 33c0 4 1.5 7.5 5 10.5"/>`,
  caravela:`<path d="M7 32h34l-6 8H13z"/><path d="M24 32V5"/><path d="M24 8c7.5 2.5 10 9 10 19H24z"/><path d="M24 11c-6 2.5-8.5 7.5-8.5 16H24z"/><path d="M24 5l5 2-5 2"/>`,
  folha:`<path d="M24 43V30"/><path d="M24 5l3.5 7 5-2-1.5 8 6-3-2 9 5 1-7 6 1.5 3-10.5-2-10.5 2 1.5-3-7-6 5-1-2-9 6 3-1.5-8 5 2z"/>`,
  tanzaku:`<path d="M17 11h14v31H17z"/><path d="M24 4v7"/><path d="M21 19h6M21 24h6M21 29h4"/><circle cx="24" cy="4" r="1.2"/>`,
  palmeira:`<path d="M24 44c0-11 1-19 3-26"/><path d="M27 18c-4-6-12-6.5-16-2 6-1 11 0 16 2zM27 18c3-7 11-9 16-6-6 0-11 2-16 6zM27 18c-8-1-14 3-15 9 4-4 9-7 15-9zM27 18c7 0 12 5 12 11-3-5-7-8-12-11z"/><path d="M18 44h14"/>`
};
const icone = (k, cls="ic") => `<svg class="${cls}" viewBox="0 0 48 48" ${G}>${ICONES[k]}</svg>`;
const Q = D.quando;
const total = 2 + D.slides.length;
const topo = `<div class="topo"><span class="data">${Q.dia} de ${Q.mes}</span></div>`;
const rodape = n => `<div class="rodape"><img src="${LOGO}" alt="Maison Invest | XP">${n === 1
  ? '<span class="deslize">Deslize <i></i></span>' : `<span class="pag">${n} / ${total}</span>`}</div>`;
const num2 = String(Q.dia).padStart(2, "0");

let html = `<section class="slide" id="s1">${topo}
  <div class="numeral">${num2}</div>
  <div class="capa-corpo">${icone(D.icone)}
    <h1>${D.capa.titulo}</h1>
    <p class="frase">${D.capa.frase}</p>
  </div>${rodape(1)}</section>`;

D.slides.forEach((s, i) => {
  const n = i + 2;
  let corpo = "";
  if (s.tipo === "edu") {
    corpo = `<div class="itens">${s.itens.map((it, j) => `<div class="item"><div class="n">0${j+1}</div><div><b>${it.t}</b><p>${it.d}</p></div></div>`).join("")}</div>`;
  } else if (s.tipo === "texto") {
    corpo = `<p class="texto-longo">${s.texto}</p>${s.marca ? `<div class="marca">${s.marca}</div>` : ""}`;
  } else if (s.tipo === "numeros") {
    corpo = `<div class="numeros">${s.numeros.map(x => `<div class="lin"><span class="v">${x.v}</span><span class="r">${x.r}</span></div>`).join("")}</div>`;
  }
  const fonte = s.fonte ? `<div class="fonte">${s.fonte}</div>` : "";
  html += `<section class="slide miolo" id="s${n}">${topo}${icone(D.icone, "ic-mini")}
    <div class="cab"><div class="rot">${s.rotulo}</div><h1>${s.titulo}</h1></div>
    ${corpo}${fonte}${rodape(n)}</section>`;
});

const cta = D.cta ? `<div class="cta"><div class="r">${D.cta.rotulo}</div><div class="c">${D.cta.convite}</div><div class="d">${D.cta.destino}</div></div>` : "";
const lema = D.sobrio ? "" : `<p class="lema"><b>Liberdade</b> nas escolhas. <b>Fraternidade</b> na relação. <b>Expertise</b> na solução.</p>`;
html += `<section class="slide" id="s${total}">${topo}
  <div class="fecha${D.cta ? "" : " sem-cta"}${D.sobrio ? " sobrio" : ""}">
    <h1>${D.fecho.titulo}</h1>
    <p class="sub">${D.fecho.texto}</p>
    ${cta}
  </div>
  ${lema}
  <div class="ident">Maison Invest, assessora de investimentos credenciada à XP Investimentos.</div>
  ${rodape(total)}</section>`;

// card para mandar ao cliente no WhatsApp (não entra no carrossel)
html += `<section class="slide card" id="card">
  <div class="numeral">${num2}</div>
  ${icone(D.icone)}
  <div class="mes">${Q.dia} de ${Q.mes}</div>
  <h1>${D.capa.titulo}</h1>
  <p class="frase">${D.fecho.texto}</p>
  ${lema}
  <div class="rodape"><img src="${LOGO}" alt="Maison Invest | XP"></div></section>`;

document.getElementById("raiz").innerHTML = html;
</script>
</body>
</html>
