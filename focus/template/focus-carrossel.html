<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Focus da semana · carrossel</title>
<style>
/*FONTES*/
:root{
  --azul:#293654; --medio:#3f5477; --claro:#93acc6; --suave:#b2cbe6;
  --ouro:#c9a96e; --branco:#ffffff; --fio:rgba(147,172,198,.22); --pad:92px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:"Gotham","Montserrat",sans-serif;color:var(--branco);
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"lnum" 1}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;margin:0 0 40px;
  /* fundo do carrossel do IPCA (azul profundo escurecido), sem a moldura */
  background:
    radial-gradient(1100px 700px at 85% -10%, rgba(63,84,119,.55), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(41,54,84,.9), transparent 65%),
    linear-gradient(170deg,#1c2742,#141c31);
  padding:var(--pad);display:flex;flex-direction:column}
.slide > *{position:relative}

/* topo da família (Selic, IGP-M): marcador, nome, contexto e data, com fio inteiro embaixo */
.topo{display:flex;justify-content:space-between;align-items:center;padding-bottom:38px;border-bottom:1px solid var(--fio);
  font-size:24px;color:var(--claro)}
.topo .k{display:flex;align-items:center;gap:14px}
.topo .k i{width:9px;height:9px;border-radius:50%;background:var(--ouro)}
.topo .k b{color:var(--branco);font-weight:700}
h2{font-weight:800;font-size:52px;line-height:1.08;letter-spacing:-.012em;margin-top:70px;text-wrap:balance}
.sub{font-size:26px;line-height:1.45;color:var(--claro);margin-top:16px;max-width:896px;text-wrap:pretty}
.rodape{margin-top:auto;font-size:20px;color:var(--claro);line-height:1.5;max-width:820px}
.ic{display:block;color:var(--ouro);flex:none}
.ic svg{width:100%;height:100%;display:block}
.logo{width:300px;display:block}

/* 1 · capa no formato da capa do IPCA (logo no alto, kicker com a perna do logotipo, título, número,
   linha da semana anterior, data e "Deslize" no pé), com o gráfico das 26 semanas */
.capa{padding:76px 76px 64px}
.capa .logo{width:300px}
.capa-main{flex:1;display:flex;flex-direction:column;justify-content:center}
.capa-kicker{font-size:24px;letter-spacing:.24em;text-transform:uppercase;color:#a9bdd4;font-weight:700;display:flex;align-items:center;gap:16px}
.perna{width:14px;height:34px;flex:none}
.capa-titulo{font-size:78px;font-weight:900;line-height:1.04;margin-top:28px;letter-spacing:-.015em;color:var(--suave);text-wrap:balance}
.capa-numero{font-size:250px;font-weight:900;line-height:.95;letter-spacing:-.04em;margin-top:26px;margin-left:-8px;white-space:nowrap}
.capa-numero small{font-size:.5em;letter-spacing:0;margin-right:14px}
.capa-sem{display:flex;align-items:baseline;gap:18px;margin-top:52px;flex-wrap:wrap}
.capa-sem .rot{font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:#a9bdd4;font-weight:700}
.capa-sem .val{font-size:56px;font-weight:900;letter-spacing:-.02em}
.capa-sem .nota{font-size:22px;color:#a9bdd4}
.capa .graf{margin-top:48px}
.capa .graf-rot{display:block;font-size:20px;color:#8299b6;margin-bottom:6px}
.capa .grafico{display:block;width:928px;height:300px;overflow:visible}
.capa-base{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(147,172,198,.18);padding-top:28px}
.capa-base .data-div{font-size:19px;color:#8299b6;letter-spacing:.02em}
.deslize{font-size:22px;color:#a9bdd4;display:flex;gap:12px;align-items:center;letter-spacing:.14em;text-transform:uppercase;font-weight:700}

/* 2 · a semana: mediana do ano e seis meses */
.tab{margin-top:64px;display:grid;grid-template-columns:230px minmax(0,1fr) 210px;column-gap:40px;align-items:center}
.tab .cab{font-size:22px;color:var(--claro);height:48px;border-bottom:1px solid var(--fio)}
.tab .cab.num{text-align:right}
.tab .ind,.tab .sp,.tab .val{height:174px;border-bottom:1px solid rgba(147,172,198,.10)}
.tab .ind{display:flex;align-items:center;gap:20px}
.tab .ind .ic{width:46px;height:46px}
.tab .ind b{font-size:34px;font-weight:700}
.tab .sp{display:flex;flex-direction:column;justify-content:center;gap:10px}
.tab .sp svg{width:100%;height:92px;display:block;overflow:visible}
.tab .sp .ini{font-size:22px;color:var(--claro)}
.tab .sp .ini b{color:var(--suave);font-weight:600}
.tab .val{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:10px}
.tab .val .v{font-size:54px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;line-height:1}
.tab .val .v small{font-size:.5em;font-weight:500;color:var(--suave);letter-spacing:0}
.tab .val .d{font-size:22px;font-weight:600;color:var(--ouro);white-space:nowrap}
.tab .val .d.parado{color:var(--claro);font-weight:500}

/* 3 · o horizonte: mediana de cada ano, do corrente a quatro à frente */
.hz{margin-top:64px;display:grid;grid-template-columns:200px repeat(5,minmax(0,1fr));align-items:center}
.hz .ano{font-size:24px;color:var(--claro);text-align:center;height:48px;border-bottom:1px solid var(--fio)}
.hz .ano.cor{color:var(--branco);font-weight:700}
.hz .ano.vazio{border-bottom:1px solid var(--fio)}
.hz .ind{display:flex;align-items:center;gap:18px;height:176px;border-bottom:1px solid rgba(147,172,198,.10)}
.hz .ind .ic{width:42px;height:42px}
.hz .ind b{font-size:32px;font-weight:700}
.hz .ind b .un{display:block;font-size:22px;font-weight:500;color:var(--claro);margin-top:6px}
.hz .ln{grid-column:2 / span 5;height:176px;border-bottom:1px solid rgba(147,172,198,.10)}
.hz .ln svg{width:100%;height:100%;display:block;overflow:visible}

/* 4 · onde há consenso */
.reguas{margin-top:72px;display:flex;flex-direction:column;gap:58px}
.regua{display:grid;grid-template-columns:180px 1fr;align-items:end}
.regua .t{display:flex;align-items:center;height:56px}
.regua .t b{font-size:30px;font-weight:700;display:flex;align-items:center;gap:16px}
.regua .t b .ic{width:36px;height:36px}
.regua .t span{font-size:24px;color:var(--suave)}
.regua .t span strong{color:var(--branco);font-weight:700;font-size:30px;margin-left:10px}
.regua > svg{display:block;width:716px;height:96px;overflow:visible}
.legenda-g{display:flex;gap:40px;margin-top:72px;font-size:22px;color:var(--claro);align-items:center}
.legenda-g span{display:flex;align-items:center;gap:12px}

/* 5 · fechamento: três cartões ilustrados (ícone, número, rótulo), sem texto de explicação */
.fim h2{font-size:56px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:96px}
.stats > div{background:rgba(63,84,119,.26);border:1px solid rgba(147,172,198,.18);border-radius:22px;padding:30px 28px 28px;display:flex;flex-direction:column}
.stats .ico{width:76px;height:76px;border-radius:50%;border:1.5px solid rgba(201,169,110,.55);display:flex;align-items:center;justify-content:center;color:var(--ouro)}
.stats .ico svg{width:38px;height:38px}
.stats b{display:block;font-size:50px;font-weight:800;letter-spacing:-.015em;margin-top:34px}
.stats span{display:block;font-size:22px;color:var(--claro);margin-top:10px;line-height:1.35}
.cta{margin-top:64px;display:inline-flex;align-items:center;gap:18px;font-size:28px;font-weight:700;padding:24px 34px;border:1.5px solid var(--ouro);border-radius:999px;align-self:flex-start}
.lema{font-size:24px;line-height:1.5;color:var(--claro);margin-top:auto}
.fim .logo{margin-top:40px}
.ident{font-size:19px;color:var(--claro);line-height:1.5;margin-top:24px;max-width:860px}
</style>
</head>
<body>
<div id="raiz"></div>
<script>
const D = /*DADOS*/null;
const LOGO = "/*LOGO*/";

const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES3 = MESES.map(m => m.slice(0,3));
const fmt = (v, c=2) => v.toFixed(c).replace(".", ",");
const data = iso => { const d = new Date(iso + "T12:00:00"); return {d:d.getDate(), m:d.getMonth(), y:d.getFullYear()}; };
const dataCurta = iso => { const x = data(iso); return `${String(x.d).padStart(2,"0")}/${String(x.m+1).padStart(2,"0")}/${x.y}`; };
const dataTopo = iso => { const x = data(iso); return `${x.d} ${MES3[x.m]} ${x.y}`; };
const diaMes = iso => { const x = data(iso); return `${String(x.d).padStart(2,"0")}/${String(x.m+1).padStart(2,"0")}`; };
const ano0 = String(D.anos[0]);
const por = Object.fromEntries(D.indicadores.map(i => [i.chave, i]));

const NOME = {ipca:"IPCA", selic:"Selic", pib:"PIB", cambio:"Dólar"};
const UNID = {ipca:"no ano", selic:"ao ano", pib:"no ano", cambio:""};
const FAIXA_MIN = {ipca:.8, selic:2, pib:.8, cambio:.5};      // seis meses: escala mínima, não exagera mexida pequena
const FAIXA_MIN_H = {ipca:2.4, selic:4.5, pib:1.6, cambio:.6}; // horizonte

// Ícones: carrinho e indústria do Iconoir (MIT, mesmos do IGP-M); percentual e dólar desenhados no mesmo traço
const ICONE = {
  ipca:`/*IC_cart*/`,
  pib:`/*IC_industry*/`,
  selic:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 16 16 8"/><circle cx="8.6" cy="8.6" r="1.6"/><circle cx="15.4" cy="15.4" r="1.6"/></svg>`,
  cambio:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 8.6c-.6-.9-1.7-1.4-3-1.4-1.7 0-2.9.9-2.9 2.2 0 3 6 1.6 6 4.7 0 1.4-1.3 2.3-3.1 2.3-1.4 0-2.6-.5-3.2-1.6M12 5.5v1.7M12 16.6v1.9"/></svg>`,
};
const ic = ch => `<i class="ic">${ICONE[ch]}</i>`;

const topo = `<div class="topo"><span class="k"><i></i><b>Focus</b>Boletim do Banco Central</span><span>${dataTopo(D.boletim.data_divulgacao)}</span></div>`;
const fonteBase = `Fonte: Banco Central, Relatório Focus de ${dataCurta(D.boletim.data_divulgacao)}, medianas das projeções de instituições de mercado. Não são projeções da Maison nem recomendação de investimento.`;
const rodape = (txt=fonteBase) => `<div class="rodape">${txt}</div>`;

const valorTab = (ch, v) => ch === "cambio" ? `<small>R$ </small>${fmt(v)}` : `${fmt(v)}<small>%</small>`;
const valorTxt = (ch, v) => ch === "cambio" ? `R$ ${fmt(v)}` : `${fmt(v)}%`;

function mudanca(ch, a){
  if (a.sentido === "estavel") return {t:"estável", parado:true};
  const seta = a.variacao_semana > 0 ? "▲" : "▼";
  const m = ch === "cambio" ? `R$ ${fmt(Math.abs(a.variacao_semana))}` : `${fmt(Math.abs(a.variacao_semana))}%`;
  return {t:`${seta} ${m}`, parado:false};
}

function escala(vals, faixaMin, extra=[]){
  const todos = vals.concat(extra);
  let mn = Math.min(...todos), mx = Math.max(...todos);
  const falta = faixaMin - (mx - mn);
  if (falta > 0) { mn -= falta / 2; mx += falta / 2; }
  return [mn, mx];
}

// ---------- 1 · Capa ----------
// Território próprio para o gráfico, entre a frase e o pé: degraus da mediana em 26 semanas,
// linha de base com os meses, valor inicial anotado e ponto final em dourado
function graficoCapa(serie){
  const W = 928, H = 300, Y0 = 30, Y1 = 236, BASE = 262;
  const vals = serie.map(s => s.mediana);
  const [mn, mx] = escala(vals, {ipca:.8, selic:1.5, pib:.8, cambio:.5}[D.destaque.chave]);
  const x = i => 6 + i * (W - 22) / (vals.length - 1);
  const y = v => Y1 - (v - mn) / (mx - mn) * (Y1 - Y0);
  let d = `M${x(0)},${y(vals[0])}`;
  for (let i = 1; i < vals.length; i++) d += ` H${x(i)} V${y(vals[i])}`;  // a mediana muda uma vez por semana
  const u = vals.length - 1, ex = x(u), ey = y(vals[u]);
  // meses: um rótulo na primeira semana de cada mês
  // um rótulo por mês; quando dois ficam a menos de 80 px (mês que começa no fim da série), fica só o mais novo
  const marcas = [];
  serie.forEach((p, i) => { const m = data(p.semana).m;
    if (!marcas.length || marcas[marcas.length - 1].m !== m) {
      if (marcas.length && x(i) - marcas[marcas.length - 1].x < 80) marcas.pop();
      marcas.push({m, x: x(i), i}); } });
  const meses = marcas.map(k => `<text x="${k.x}" y="${H - 4}" fill="#93acc6" font-size="24" font-family="Montserrat" text-anchor="${k.i === 0 ? "start" : k.x > W - 40 ? "end" : "middle"}">${MES3[k.m]}</text>`).join("");
  const ch = D.destaque.chave;
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93acc6" stop-opacity=".18"/><stop offset="1" stop-color="#93acc6" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} V${BASE} H${x(0)} Z" fill="url(#area)"/>
    <line x1="0" x2="${W}" y1="${BASE}" y2="${BASE}" stroke="#93acc6" stroke-opacity=".3"/>
    <path d="${d}" fill="none" stroke="#b2cbe6" stroke-opacity=".85" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="${x(0)}" cy="${y(vals[0])}" r="5" fill="#26314d" stroke="#b2cbe6" stroke-width="2"/>
    <text x="${x(0)}" y="${(Math.max(...vals.slice(1, 6)) >= vals[0] && y(vals[0]) + 40 < BASE - 30) ? y(vals[0]) + 40 : y(vals[0]) - 18}" fill="#b2cbe6" font-size="22" font-family="Montserrat">${valorTxt(ch, vals[0])}</text>
    <circle cx="${ex}" cy="${ey}" r="20" fill="#c9a96e" fill-opacity=".16"/>
    <circle cx="${ex}" cy="${ey}" r="8" fill="#c9a96e"/>
    ${meses}
  </svg>`;
}
const chD = D.destaque.chave, aD = por[chD].anos[ano0];
const PERNA = `<svg class="perna" viewBox="0 0 14 34"><line x1="10" y1="3" x2="4" y2="31" stroke="#c9a96e" stroke-width="5" stroke-linecap="round"/></svg>`;
const numCapa = chD === "cambio" ? `<small>R$</small>${fmt(aD.mediana)}` : `${fmt(aD.mediana)}%`;
const s1 = `<section class="slide capa">
  <div><img class="logo" src="${LOGO}" alt="Maison Invest | XP"></div>
  <div class="capa-main">
    <div class="capa-kicker">${PERNA}<span>Focus · expectativas de mercado</span></div>
    <div class="capa-titulo">${D.textos.capa_titulo}</div>
    <div class="capa-numero" style="font-size:${fmt(aD.mediana).length > 4 ? 218 : 250}px">${numCapa}</div>
    <div class="capa-sem"><span class="rot">Semana anterior</span><span class="val">${valorTxt(chD, aD.semana_anterior)}</span><span class="nota">${D.textos.capa_nota}</span></div>
    <div class="graf"><span class="graf-rot">Mediana para ${ano0}, últimas ${aD.serie.length} semanas</span>${graficoCapa(aD.serie)}</div>
  </div>
  <div class="capa-base"><div class="data-div">Divulgado pelo Banco Central em ${dataCurta(D.boletim.data_divulgacao)}</div>
    <div class="deslize">Deslize <svg width="34" height="16" viewBox="0 0 34 16"><path d="M0 8h30M24 2l7 6-7 6" stroke="#c9a96e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
</section>`;

// ---------- 2 · As projeções do ano ----------
// Seis meses: linha de referência no valor de seis meses atrás; a área entre ela e a linha mostra o desvio
function seisMeses(serie, ch){
  const W = 420, H = 92, X0 = 8, X1 = W - 10;
  const vals = serie.map(s => s.mediana), ref = vals[0];
  const [mn, mx] = escala(vals, FAIXA_MIN[ch]);
  const x = i => X0 + i * (X1 - X0) / (vals.length - 1);
  const y = v => 8 + (1 - (v - mn) / (mx - mn)) * (H - 16);
  let d = `M${x(0)},${y(vals[0])}`;
  for (let i = 1; i < vals.length; i++) d += ` H${x(i)} V${y(vals[i])}`;
  const u = vals.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} V${y(ref)} H${x(0)} Z" fill="#93acc6" fill-opacity=".14"/>
    <line x1="${X0}" x2="${X1}" y1="${y(ref)}" y2="${y(ref)}" stroke="#93acc6" stroke-opacity=".35" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    <path d="${d}" fill="none" stroke="#c9a96e" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(0)}" cy="${y(ref)}" r="5" fill="#2a3654" stroke="#93acc6" stroke-width="2"/>
    <circle cx="${x(u)}" cy="${y(vals[u])}" r="7" fill="#c9a96e"/>
  </svg>`;
}
const linhas2 = D.indicadores.map(i => {
  const a = i.anos[ano0], m = mudanca(i.chave, a), ini = a.serie[0];
  const mesIni = MESES[data(ini.semana).m];
  return `<div class="ind">${ic(i.chave)}<b>${NOME[i.chave]}</b></div>
    <div class="sp">${seisMeses(a.serie, i.chave)}<span class="ini">em ${mesIni}, <b>${valorTxt(i.chave, ini.mediana)}</b></span></div>
    <div class="val"><div class="v">${valorTab(i.chave, a.mediana)}</div><div class="d ${m.parado?"parado":""}">${m.t}</div></div>`;
}).join("");
const s2 = `<section class="slide">${topo}
  <h2>${D.textos.painel_titulo}</h2>
  <p class="sub">${D.textos.painel_sub}</p>
  <div class="tab">
    <div class="cab"></div><div class="cab">últimos seis meses</div><div class="cab num">mediana</div>
    ${linhas2}
  </div>
  ${rodape()}
</section>`;

// ---------- 3 · O horizonte ----------
const ANOS_H = por.ipca.horizonte.map(h => h.ano);
function horizonte(i){
  const W = 696, H = 176, n = ANOS_H.length;
  const col = W / n, x = k => col * (k + .5);
  const vals = i.horizonte.map(h => h.mediana);
  const meta = i.chave === "ipca" ? [3] : [];
  const [mn, mx] = escala(vals, FAIXA_MIN_H[i.chave], meta);
  const y = v => 58 + (1 - (v - mn) / (mx - mn)) * (H - 58 - 26);
  const pts = vals.map((v, k) => `${x(k).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const metaSvg = meta.length ? `<line x1="0" x2="${W}" y1="${y(3)}" y2="${y(3)}" stroke="#93acc6" stroke-opacity=".28" stroke-width="1.2"/>
    <text x="4" y="${y(3) - 14}" fill="#93acc6" font-size="22" font-family="Montserrat" text-anchor="start">meta 3%</text>` : "";
  const pontos = vals.map((v, k) => k === 0
    ? `<circle cx="${x(k)}" cy="${y(v)}" r="9" fill="#c9a96e"/>`
    : `<circle cx="${x(k)}" cy="${y(v)}" r="7" fill="#26314d" stroke="#c9a96e" stroke-width="2.2"/>`).join("");
  const rot = vals.map((v, k) => `<text x="${x(k)}" y="${y(v) - 22}" fill="${k === 0 ? "#ffffff" : "#b2cbe6"}" font-weight="${k === 0 ? 700 : 500}" font-size="25" font-family="Montserrat" text-anchor="middle">${i.chave === "cambio" ? fmt(v) : fmt(v) + "%"}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${metaSvg}
    <polyline points="${pts}" fill="none" stroke="#c9a96e" stroke-width="2.2" stroke-linejoin="round" stroke-opacity=".9"/>${pontos}${rot}</svg>`;
}
const respLonge = D.indicadores.flatMap(i => i.horizonte.filter(h => h.ano >= D.anos[0] + 2).map(h => h.respondentes));
const s3 = `<section class="slide">${topo}
  <h2>${D.textos.horizonte_titulo}</h2>
  <p class="sub">${D.textos.horizonte_sub}</p>
  <div class="hz">
    <div class="ano vazio"></div>${ANOS_H.map((a, k) => `<div class="ano ${k === 0 ? "cor" : ""}">${a}</div>`).join("")}
    ${D.indicadores.map(i => `<div class="ind">${ic(i.chave)}<b>${NOME[i.chave]}${i.chave === "cambio" ? '<span class="un">R$ por US$</span>' : ""}</b></div><div class="ln">${horizonte(i)}</div>`).join("")}
  </div>
  ${rodape(`Fonte: Banco Central, Relatório Focus de ${dataCurta(D.boletim.data_divulgacao)}, medianas. De ${D.anos[0] + 2} em diante, ${Math.min(...respLonge)} a ${Math.max(...respLonge)} instituições projetam. Não são projeções da Maison nem recomendação de investimento.`)}
</section>`;

// ---------- 4 · Onde há consenso ----------
// Todas as réguas na mesma escala relativa (distância da mediana em %), então a largura compara a concordância
const REL = (() => {
  let r = 0;
  for (const i of D.indicadores) { const a = i.anos[ano0];
    r = Math.max(r, Math.abs(a.minimo / a.mediana - 1), Math.abs(a.maximo / a.mediana - 1)); }
  return r * 1.04;
})();
function regua(ch, a){
  const W = 716, H = 96, X0 = 118, X1 = W - 118, Y = 68, C = (X0 + X1) / 2;
  const x = v => C + (v / a.mediana - 1) / REL * (X1 - X0) / 2;
  const lo = a.minimo, hi = a.maximo;
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <rect x="${x(lo) - 14}" y="${Y-14}" width="${x(hi) - x(lo) + 28}" height="28" rx="14" fill="rgba(147,172,198,.32)"/>
    <circle cx="${C}" cy="${Y}" r="14" fill="#c9a96e" stroke="#25304b" stroke-width="3"/>
    <text x="${C}" y="${Y - 30}" fill="#ffffff" font-size="28" font-weight="700" font-family="Montserrat" text-anchor="middle">${valorTxt(ch, a.mediana)}</text>
    <text x="${x(lo) - 28}" y="${Y + 8}" fill="#b2cbe6" font-size="24" font-family="Montserrat" text-anchor="end">${valorTxt(ch, lo)}</text>
    <text x="${x(hi) + 28}" y="${Y + 8}" fill="#b2cbe6" font-size="24" font-family="Montserrat" text-anchor="start">${valorTxt(ch, hi)}</text>
  </svg>`;
}
const nResp = Math.min(...D.indicadores.map(i => i.anos[ano0].respondentes));
const nRespMax = Math.max(...D.indicadores.map(i => i.anos[ano0].respondentes));
const s4 = `<section class="slide">${topo}
  <h2>${D.textos.consenso_titulo}</h2>
  <p class="sub">${D.textos.consenso_sub}</p>
  <div class="reguas">${D.indicadores.map(i => { const a = i.anos[ano0];
    return `<div class="regua"><div class="t"><b>${ic(i.chave)}${NOME[i.chave]}</b></div>${regua(i.chave, a)}</div>`; }).join("")}</div>
  <div class="legenda-g">
    <span><svg width="26" height="26"><circle cx="13" cy="13" r="11" fill="#c9a96e"/></svg>mediana</span>
    <span><svg width="44" height="22"><rect x="1" y="2" width="42" height="18" rx="9" fill="rgba(147,172,198,.32)"/></svg>da menor à maior projeção</span>
  </div>
  ${rodape(`Fonte: Banco Central, Relatório Focus de ${dataCurta(D.boletim.data_divulgacao)}, projeções para ${ano0} de ${nResp} a ${nRespMax} instituições. Não são projeções da Maison nem recomendação de investimento.`)}
</section>`;

// ---------- 5 · Fechamento ----------
const CALENDARIO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>`;
const s5 = `<section class="slide fim">${topo}
  <h2>${D.textos.fechamento_titulo}</h2>
  <div class="stats">
    <div><i class="ico">${ICONE.selic}</i><b>${valorTxt("selic", por.selic.anos[ano0].mediana)}</b><span>Selic no fim de ${ano0}</span></div>
    <div><i class="ico">${ICONE.ipca}</i><b>${valorTxt("ipca", por.ipca.anos[ano0].mediana)}</b><span>IPCA em ${ano0}</span></div>
    <div><i class="ico">${CALENDARIO}</i><b>${diaMes(D.boletim.proxima)}</b><span>próximo boletim</span></div>
  </div>
  <p class="cta">Quer conversar sobre o seu patrimônio? Link na bio.</p>
  <p class="lema">Liberdade nas escolhas. Fraternidade na relação.<br>Expertise na solução.</p>
  <img class="logo" src="${LOGO}" alt="Maison Invest | XP">
  <p class="ident">Conteúdo informativo, sem recomendação de investimento.</p>
</section>`;

document.getElementById("raiz").innerHTML = s1 + s2 + s3 + s4 + s5;
</script>
</body>
</html>
