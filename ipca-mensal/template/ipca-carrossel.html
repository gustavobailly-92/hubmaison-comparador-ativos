<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPCA mensal</title>
<style>
/* Fontes: Gotham primeiro (oficial); Montserrat embutida como substituta. */
@font-face{font-family:"Montserrat";font-weight:400;src:url("__FONT_400__") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:500;src:url("__FONT_500__") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:700;src:url("__FONT_700__") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:800;src:url("__FONT_800__") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:900;src:url("__FONT_900__") format("woff2")}

:root{
  /* paleta institucional Maison */
  --azul-profundo:#293654; --azul-medio:#3f5477; --azul-claro:#93acc6; --azul-suave:#b2cbe6;
  /* fundo: o azul profundo escurecido, como no relatório da Wealth */
  --bg-0:#141c31; --bg-1:#1c2742; --bg-2:#233050;
  --surface:rgba(63,84,119,.26); --line:rgba(147,172,198,.18); --grid:rgba(147,172,198,.12);
  --ink:#f3f6fb; --ink-2:#d3e0ef; --ink-3:#a9bdd4; --ink-4:#8299b6;
  --alta:#b2cbe6; --alta-fraca:#7089ad;
  --queda:#e08072; --queda-fraca:#b86b62;
  --ouro:#c9a96e; /* acento fino aprovado para Instagram: fios, médias, marcadores */
  --font:"Gotham","Montserrat",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d1324}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#deck{display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0}

.slide{
  position:relative;width:1080px;height:1350px;overflow:hidden;flex:none;
  padding:76px 76px 64px;display:flex;flex-direction:column;
  background:
    radial-gradient(1100px 700px at 85% -10%, rgba(63,84,119,.55), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(41,54,84,.9), transparent 65%),
    linear-gradient(170deg,var(--bg-1),var(--bg-0));
}
.slide::after{ /* moldura fina */
  content:"";position:absolute;inset:28px;border:1px solid var(--line);border-radius:28px;pointer-events:none}

/* topo */
.top{display:flex;justify-content:space-between;align-items:center;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.kicker{display:flex;align-items:center;gap:16px}
.perna{width:14px;height:34px;flex:none}   /* perna inicial do logotipo, no lugar de travessões */
.count{font-weight:500;letter-spacing:.12em;color:var(--ink-3)}

h2{font-size:46px;line-height:1.1;font-weight:900;letter-spacing:-.01em;margin-top:40px;max-width:900px;text-wrap:balance}
.sub{font-size:26px;line-height:1.42;color:var(--ink-3);margin-top:16px;max-width:900px}
.sub b{color:var(--ink);font-weight:700}
.proj-txt{font-size:30px;line-height:1.5;color:var(--ink-2);margin-top:56px;max-width:900px}
.proj-txt b{color:var(--ink);font-weight:800}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;padding-top:28px}
.fonte{font-size:20px;line-height:1.4;color:var(--ink-4);max-width:560px}
.logo{display:block;height:auto}
.foot .logo{width:250px}

/* números */
.neg{color:var(--queda)} .pos{color:var(--ink)}
svg text{font-family:var(--font)}

/* capa */
.capa .top{justify-content:space-between}
.capa .logo{width:300px}
.capa-main{flex:1;display:flex;flex-direction:column;justify-content:center}
.capa-kicker{font-size:24px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);font-weight:700;display:flex;align-items:center;gap:16px}
.capa-titulo{font-size:92px;font-weight:900;line-height:1;margin-top:28px;letter-spacing:-.015em}
.capa-numero{font-size:250px;font-weight:900;line-height:.95;letter-spacing:-.04em;margin-top:26px;margin-left:-8px}
.capa-destaque{font-size:34px;font-weight:700;color:var(--ink-2);margin-top:30px;display:flex;align-items:center;gap:18px}
.capa-destaque .fio{width:56px;height:2px;background:var(--ouro);flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 26px 24px}
.stat .rot{font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.stat .val{font-size:54px;font-weight:900;margin-top:12px;letter-spacing:-.02em}
.stat .nota{font-size:19px;color:var(--ink-4);margin-top:8px;line-height:1.35}
.data-div{font-size:20px;color:var(--ink-3);letter-spacing:.06em}
.deslize{font-size:22px;color:var(--ink-3);display:flex;gap:12px;align-items:center;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.capa-base{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:28px}
.capa-base .data-div{font-size:19px;color:var(--ink-4);letter-spacing:.02em}
.capa-12m{display:flex;align-items:baseline;gap:18px;margin-top:64px;flex-wrap:wrap}
.capa-12m .rot{font-size:21px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.capa-12m .val{font-size:56px;font-weight:900;letter-spacing:-.02em}
.capa-12m .nota{font-size:22px;color:var(--ink-3)}
.regua{margin-top:10px}
.proj{list-style:none;margin-top:46px;display:flex;flex-direction:column;gap:24px}
.proj li{font-size:27px;line-height:1.45;color:var(--ink-2);padding-left:28px;position:relative}
.proj li::before{content:"";position:absolute;left:0;top:.58em;width:10px;height:10px;border-radius:50%;background:var(--ouro)}
.proj b{color:var(--ink);font-weight:800}

/* expectativas */
.trilho-wrap{margin-top:8px}
.trilho-rot{display:flex;justify-content:space-between;font-size:22px;color:var(--ink-3);margin-bottom:14px}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}

/* fechamento */
.fecho-main{flex:1;display:flex;flex-direction:column;justify-content:center}
.fecho-kicker{font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:18px;line-height:1.5}
.fecho-titulo{font-size:120px;font-weight:900;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.fecho-texto{font-size:30px;line-height:1.5;color:var(--ink-2);margin-top:34px;max-width:860px}
.cta{margin-top:56px;display:inline-flex;align-items:center;gap:18px;font-size:28px;font-weight:700;color:var(--ink);padding:24px 34px;border:1.5px solid var(--ouro);border-radius:999px;align-self:flex-start}
.lema{font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500;line-height:1.6}
.legal{font-size:18px;line-height:1.45;color:var(--ink-4);margin-top:26px;max-width:930px}
.fecho-base{border-top:1px solid var(--line);padding-top:40px}
.fecho-base .linha{display:flex;justify-content:space-between;align-items:center;gap:30px}
.fecho-base .logo{width:330px}
</style>
</head>
<body>
<div id="deck"></div>

<script>
/* ===================== utilidades ===================== */
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES_C=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const LOGO="__LOGO__";

function pct(v,casas=2,sinal=false){
  const s=Math.abs(v).toFixed(casas).replace(".",",");
  if(+s.replace(",",".")===0) return s+"%";
  if(v<0) return "-"+s+"%";
  return (sinal&&v>0?"+":"")+s+"%";
}
function pp(v,casas=2){const s=Math.abs(v).toFixed(casas).replace(".",",");if(+s.replace(",",".")===0)return s+" p.p.";return (v<0?"-":"+")+s+" p.p."}
function num(v,c=2){return Math.abs(v).toFixed(c).replace(".",",")}
function cls(v){return v<0?"neg":"pos"}
function mesAno(iso){const [a,m]=iso.split("-").map(Number);return {mes:MESES[m-1],curto:MES_C[m-1],ano:a,m}}
function dataBR(iso){if(!iso)return "";const [a,m,d]=iso.split("-");return `${d}/${m}/${a}`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

const PERNA=`<svg class="perna" viewBox="0 0 14 34"><line x1="10" y1="3" x2="4" y2="31" stroke="#c9a96e" stroke-width="5" stroke-linecap="round"/></svg>`;

function topo(d,i,n,rotulo){
  const r=mesAno(d.referencia);
  return `<div class="top"><div class="kicker">${PERNA}<span>${rotulo||`IPCA · ${r.mes} ${r.ano}`}</span></div></div>`;
}
function rodape(fonte){
  return `<div class="foot"><div class="fonte">${fonte}</div><img class="logo" src="${LOGO}" alt="Maison Invest e XP Investimentos"></div>`;
}

/* escala vertical "bonita" */
function escala(min,max,passo){
  const lo=Math.min(0,Math.floor(min/passo)*passo), hi=Math.max(0,Math.ceil(max/passo)*passo);
  const ticks=[];for(let t=lo;t<=hi+1e-9;t+=passo)ticks.push(+t.toFixed(4));
  return {lo,hi,ticks};
}

/* ===================== gráfico de colunas ===================== */
function colunas({itens,media,W=928,H=640,destaqueUltimo=true,rotMedia}){
  const vals=itens.map(i=>i.v);
  const amp=Math.max(...vals,0)-Math.min(...vals,0);
  const passo=[0.25,0.5,1,2].find(p=>amp/p<=5)||2;
  const mn=Math.min(...vals,media??0), mx=Math.max(...vals,media??0);
  const {lo,hi,ticks}=escala(mn<0?mn-0.08:0,mx>0?mx+0.12:0,passo);
  const top=media!=null?84:48,bot=84,left=86,right=8;
  const ih=H-top-bot, iw=W-left-right;
  const y=v=>top+(hi-v)/(hi-lo)*ih;
  const n=itens.length, slot=iw/n, bw=Math.min(slot*0.62,58);
  let g="";
  ticks.forEach(t=>{g+=`<line x1="${left}" x2="${W-right}" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?"rgba(178,203,230,.55)":"var(--grid)"}" stroke-width="${t===0?2:1}"/>`;
    g+=`<text x="${left-16}" y="${y(t)+7}" text-anchor="end" font-size="20" fill="var(--ink-4)">${pct(t,passo<0.5?2:passo<1?1:0)}</text>`});
  itens.forEach((it,k)=>{
    const cx=left+slot*k+slot/2, ultimo=destaqueUltimo&&k===n-1;
    const y0=y(0), yv=y(it.v), h=Math.max(Math.abs(yv-y0),3);
    const ytop=it.v>=0?y0-h:y0;
    const fill=it.v<0?(ultimo?"var(--queda)":"var(--queda-fraca)"):(ultimo?"var(--alta)":"var(--alta-fraca)");
    g+=`<rect x="${cx-bw/2}" y="${ytop}" width="${bw}" height="${h}" rx="7" fill="${fill}"/>`;
    const ty=it.v>=0?ytop-14:ytop+h+32;
    g+=`<text x="${cx}" y="${ty}" text-anchor="middle" font-size="${ultimo?24:19}" font-weight="${ultimo?900:700}" fill="${it.v<0?"var(--queda)":(ultimo?"var(--ink)":"var(--ink-2)")}">${pct(it.v)}</text>`;
    const [l1,l2]=String(it.r).split("/");
    const cor=ultimo?"var(--ink)":"var(--ink-3)", pe=ultimo?800:500;
    if(l2!==undefined){
      g+=`<text x="${cx}" y="${H-38}" text-anchor="middle" font-size="21" font-weight="${pe}" fill="${cor}">${l1}</text>`;
      g+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="19" font-weight="${pe}" fill="${ultimo?"var(--ink-2)":"var(--ink-4)"}">${l2}</text>`;
    } else g+=`<text x="${cx}" y="${H-22}" text-anchor="middle" font-size="22" font-weight="${pe}" fill="${cor}">${l1}</text>`;
  });
  if(media!=null){
    g+=`<line x1="${left}" x2="${W-right}" y1="${y(media)}" y2="${y(media)}" stroke="var(--ouro)" stroke-width="2" stroke-dasharray="8 8"/>`;
    const rot=`${rotMedia||"média"} ${pct(media)}`, est=rot.length*12.2, xs=W-right-est-18;
    g+=`<line x1="${xs-40}" x2="${xs}" y1="14" y2="14" stroke="var(--ouro)" stroke-width="3" stroke-dasharray="8 6"/>`;
    g+=`<text x="${W-right}" y="21" text-anchor="end" font-size="21" font-weight="700" fill="var(--ouro)">${rot}</text>`;
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ===================== barras horizontais divergentes ===================== */
function barrasH({linhas,W=928,rowH=62,colNome=300,colVal=170,dominio,marcador,formato=pct,extraAoLado=0,cab}){
  const off=cab?44:0; const H=linhas.length*rowH+8+off;
  const x0=colNome, x1=W-colVal; const iw=x1-x0;
  const mn=Math.min(0,...linhas.map(l=>l.v),...(marcador?linhas.map(l=>l.m):[]));
  const mx=Math.max(0,...linhas.map(l=>l.v),...(marcador?linhas.map(l=>l.m):[]));
  const lo=dominio?dominio[0]:mn*1.05, hi=dominio?dominio[1]:mx*1.05;
  const X=v=>x0+(v-lo)/(hi-lo||1)*iw;
  let g=`<line x1="${X(0)}" x2="${X(0)}" y1="${off}" y2="${H}" stroke="rgba(178,203,230,.45)" stroke-width="2"/>`;
  if(cab){cab.forEach(c=>{g+=`<text x="${c.x}" y="22" text-anchor="end" font-size="18" font-weight="700" letter-spacing="2.5" fill="var(--ink-4)">${c.t}</text>`})}
  linhas.forEach((l,k)=>{
    const cy=off+k*rowH+rowH/2, dest=l.destaque;
    if(dest) g+=`<rect x="-6" y="${cy-rowH/2+4}" width="${W+6}" height="${rowH-8}" rx="14" fill="rgba(147,172,198,.13)"/>`;
    const tx0=l.icone?64:12;
    if(l.icone) g+=icone(l.icone,26,cy,46);
    const sobe=l.nota||l.peso!=null;
    g+=`<text x="${tx0}" y="${cy+(sobe?-4:8)}" font-size="${sobe?24:25}" font-weight="${dest?900:700}" fill="${dest?"var(--ink)":"var(--ink-2)"}">${esc(l.nome)}</text>`;
    if(l.nota&&l.peso==null) g+=`<text x="${tx0}" y="${cy+24}" font-size="18" fill="var(--ink-4)">${esc(l.nota)}</text>`;
    if(l.peso!=null){const bw=96,fw=bw*l.peso/(l.pesoMax||l.peso);
      g+=`<rect x="${tx0}" y="${cy+13}" width="${bw}" height="6" rx="3" fill="rgba(147,172,198,.18)"/><rect x="${tx0}" y="${cy+13}" width="${fw}" height="6" rx="3" fill="var(--alta)"/>`;
      g+=`<text x="${tx0+bw+10}" y="${cy+21}" font-size="17" fill="var(--ink-4)">peso ${num(l.peso,0)}%</text>`;}
    const bh=dest?26:22, xa=X(Math.min(0,l.v)), xb=X(Math.max(0,l.v));
    g+=`<rect x="${xa}" y="${cy-bh/2}" width="${Math.max(xb-xa,3)}" height="${bh}" rx="6" fill="${l.v<0?"var(--queda)":"var(--alta)"}" opacity="${dest?1:.92}"/>`;
    if(marcador&&l.m!=null){const xm=X(l.m);g+=`<line x1="${xm}" x2="${xm}" y1="${cy-bh/2-7}" y2="${cy+bh/2+7}" stroke="var(--ouro)" stroke-width="3" stroke-linecap="round"/>`}
    const xv=W-6-extraAoLado, empilha=l.extra&&!extraAoLado;
    g+=`<text x="${xv}" y="${cy+(empilha?-2:9)}" text-anchor="end" font-size="${dest?27:25}" font-weight="900" fill="${l.v<0?"var(--queda)":"var(--ink)"}">${formato(l.v)}</text>`;
    if(empilha) g+=`<text x="${W-6}" y="${cy+24}" text-anchor="end" font-size="18" fill="var(--ink-4)">${esc(l.extra)}</text>`;
    if(l.extra&&extraAoLado) g+=`<text x="${W-6}" y="${cy+9}" text-anchor="end" font-size="23" font-weight="${dest?800:500}" fill="${dest?"var(--ink-2)":"var(--ink-3)"}">${esc(l.extra)}</text>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ===================== textos automáticos ===================== */
function mediana(d){return d.projecoes&&d.projecoes.mediana!=null?d.projecoes.mediana:(d.indice.mediana_esperada??null)}
function textos(d){
  const T=d.textos||{}; const ix=d.indice; const r=mesAno(d.referencia); const P=d.projecoes||{};
  const doAno=d.historico_12m.filter(h=>h.mes.startsWith(String(r.ano)));
  const negsAno=doAno.filter(h=>h.variacao<0).length;
  const med=mediana(d);
  let destaque;
  if(ix.variacao<0 && negsAno===1) destaque=`Primeira deflação de ${r.ano}`;
  else if(ix.variacao<0) destaque=`Deflação em ${r.mes}`;
  else if(P.intervalo_min!=null && ix.variacao<P.intervalo_min) destaque=`Abaixo até da menor projeção do mercado`;
  else if(P.intervalo_max!=null && ix.variacao>P.intervalo_max) destaque=`Acima até da maior projeção do mercado`;
  else if(med!=null && ix.variacao>med) destaque=`Acima do que o mercado esperava`;
  else if(med!=null && ix.variacao<med) destaque=`Abaixo do que o mercado esperava`;
  else destaque=`Em linha com o esperado`;

  let proj="";
  if(med!=null){
    if(P.intervalo_min!=null && ix.variacao<P.intervalo_min) proj=`O IPCA veio abaixo até do piso das projeções`;
    else if(P.intervalo_max!=null && ix.variacao>P.intervalo_max) proj=`O IPCA veio acima até do teto das projeções`;
    else if(ix.variacao<med) proj=`O IPCA veio ${num(med-ix.variacao)} p.p. abaixo do esperado`;
    else if(ix.variacao>med) proj=`O IPCA veio ${num(ix.variacao-med)} p.p. acima do esperado`;
    else proj=`O IPCA veio em linha com o esperado`;
  }

  const g=d.grupos.map(x=>({...x,c:x.peso*x.atual/100}));
  const pos=g.filter(x=>x.c>0).sort((p,q)=>q.c-p.c), neg=g.filter(x=>x.c<0).sort((p,q)=>p.c-q.c);
  const nomes=a=>a.map(x=>x.curto).join(" e ");
  let contrib;
  if(ix.variacao>=0 && neg.length && Math.abs(neg[0].c)>=0.05 && pos.length){
    const a=pos.slice(0,1), b=neg.filter(x=>Math.abs(x.c)>=0.05).slice(0,2);
    contrib=`${nomes(a)} ${a.length>1?"pressionaram":"pressionou"}; ${nomes(b)} ${b.length>1?"seguraram":"segurou"} o índice`;
  } else if(ix.variacao<0 && pos.length && pos[0].c>=0.05 && neg.length){
    const a=neg.slice(0,2), b=pos.slice(0,1);
    contrib=`${nomes(a)} ${a.length>1?"puxaram":"puxou"} para baixo; ${nomes(b)} ${b.length>1?"subiram":"subiu"}`;
  } else if(ix.variacao<0){const a=neg.slice(0,2);contrib=`${nomes(a)} ${a.length>1?"puxaram":"puxou"} o índice para baixo`}
  else {const a=pos.slice(0,2);contrib=`${nomes(a)} ${a.length>1?"pressionaram":"pressionou"} o índice`}

  const sw=[...d.grupos].sort((p,q)=>Math.abs(q.atual-q.anterior)-Math.abs(p.atual-p.anterior))[0];
  const grupos=`${sw.nome} foi de ${pct(sw.anterior,2,true)} para ${pct(sw.atual,2,true)}`;

  const nNeg=d.regioes.filter(x=>x.atual<0).length, nTot=d.regioes.length;
  let regioes;
  if(nNeg===nTot) regioes=`Preços em queda nas ${nTot} regiões pesquisadas`;
  else if(nNeg===0) regioes=`Preços em alta nas ${nTot} regiões pesquisadas`;
  else if(nNeg===1) regioes=`Só 1 das ${nTot} regiões teve deflação`;
  else regioes=`${nNeg} das ${nTot} regiões tiveram deflação`;

  /* matriz: grupo que mais aparece entre as 5 maiores altas e as 5 maiores quedas */
  let matriz="";
  if(d.matriz){
    const cel=[];d.matriz.forEach(m=>d.grupos.forEach(gr=>cel.push({g:gr.curto,v:m.valores[gr.id],reg:m.nome})));
    const top=[...cel].sort((a,b)=>b.v-a.v).slice(0,5), bot=[...cel].sort((a,b)=>a.v-b.v).slice(0,5);
    const moda=a=>{const c={};a.forEach(x=>c[x.g]=(c[x.g]||0)+1);return Object.entries(c).sort((p,q)=>q[1]-p[1])[0]};
    const mt=moda(top), mb=moda(bot);
    matriz= mt[0]===mb[0]?`${mt[0]} nos dois extremos`
      :`Altas em ${mt[1]>1?mt[0]:top[0].g}, quedas em ${mb[1]>1?mb[0]:bot[0].g}`;
  }

  const hist=d.mesmo_mes_anos_anteriores; const todos=[...hist.map(h=>h.variacao),ix.variacao];
  const media=hist.reduce((s,h)=>s+h.variacao,0)/hist.length;
  const desde=hist[0].ano;
  const rkMaior=todos.filter(v=>v>ix.variacao).length+1, rkMenor=todos.filter(v=>v<ix.variacao).length+1;
  let historia;
  if(ix.variacao<0) historia= rkMenor===1?`A maior deflação para um mês de ${r.mes} desde ${desde}`:`A ${rkMenor}ª maior deflação para um mês de ${r.mes} desde ${desde}`;
  else if(rkMaior<=3) historia=`O ${rkMaior}º maior IPCA para um mês de ${r.mes} desde ${desde}`;
  else if(rkMenor<=3) historia= rkMenor===1?`O menor IPCA para um mês de ${r.mes} desde ${desde}`:`O ${rkMenor}º menor IPCA para um mês de ${r.mes} desde ${desde}`;
  else historia= ix.variacao>media?`Acima da média de ${r.mes} dos últimos ${hist.length} anos`:`Abaixo da média de ${r.mes} dos últimos ${hist.length} anos`;

  const faltamMeses=12-r.m;
  const alvo=d.focus.ipca_ano_corrente;
  const falta=((1+alvo/100)/(1+ix.acumulado_ano/100)-1)*100;
  const mensal=faltamMeses>0?(Math.pow(1+falta/100,1/faltamMeses)-1)*100:0;
  const expect=faltamMeses>0?`Faltam ${pct(falta)} até dezembro para ${r.ano} fechar nos ${pct(alvo)} do Focus`
                             :`${r.ano} fechou em ${pct(ix.acumulado_ano)}`;
  return {
    capa_destaque:T.capa_destaque||destaque,
    projecoes_titulo:T.projecoes_titulo||proj,
    contribuicao_titulo:T.contribuicao_titulo||contrib,
    grupos_titulo:T.grupos_titulo||grupos,
    regioes_titulo:T.regioes_titulo||regioes,
    matriz_titulo:T.matriz_titulo||matriz,
    historia_titulo:T.historia_titulo||historia,
    expectativas_titulo:T.expectativas_titulo||expect,
    _media:media,_falta:falta,_mensal:mensal,_faltamMeses:faltamMeses,_med:med
  };
}

/* ===================== régua das projeções ===================== */
function regua(d){
  const P=d.projecoes, v=d.indice.variacao, W=928, H=230;
  const marcas=[{v,rot:"IPCA",dest:true}];
  if(P.mediana!=null) marcas.push({v:P.mediana,rot:"Mediana"});
  (P.casas||[]).forEach(c=>marcas.push({v:c.projecao,rot:c.nome.replace(" Investimentos","")}));
  const vals=[...marcas.map(m=>m.v),P.intervalo_min??v,P.intervalo_max??v];
  const lo=Math.floor((Math.min(...vals)-0.05)*20)/20, hi=Math.ceil((Math.max(...vals)+0.05)*20)/20;
  const L=10,R=W-10, X=x=>L+(x-lo)/(hi-lo)*(R-L), y=118;
  let g=`<line x1="${L}" x2="${R}" y1="${y}" y2="${y}" stroke="rgba(178,203,230,.35)" stroke-width="2"/>`;
  for(let t=lo;t<=hi+1e-9;t+=0.05){const tt=+t.toFixed(2);const maior=Math.abs(tt*10-Math.round(tt*10))<1e-6;
    g+=`<line x1="${X(tt)}" x2="${X(tt)}" y1="${y-(maior?10:5)}" y2="${y+(maior?10:5)}" stroke="rgba(178,203,230,.4)" stroke-width="1.5"/>`;
    if(maior) g+=`<text x="${X(tt)}" y="${y+40}" text-anchor="middle" font-size="19" fill="var(--ink-4)">${pct(tt,1)}</text>`;}
  if(P.intervalo_min!=null&&P.intervalo_max!=null){
    g+=`<rect x="${X(P.intervalo_min)}" y="${y-16}" width="${X(P.intervalo_max)-X(P.intervalo_min)}" height="32" rx="16" fill="rgba(147,172,198,.22)" stroke="rgba(178,203,230,.45)"/>`;
    g+=`<text x="${X(P.intervalo_min)}" y="${y+78}" font-size="19" fill="var(--ink-3)">piso ${pct(P.intervalo_min)}</text>`;
    g+=`<text x="${X(P.intervalo_max)}" y="${y+78}" text-anchor="end" font-size="19" fill="var(--ink-3)">teto ${pct(P.intervalo_max)}</text>`;
  }
  const outras=marcas.filter(m=>!m.dest).sort((a,b)=>a.v-b.v);
  outras.forEach((m,k)=>{const x=X(m.v), ly=y-74-Math.floor(k/2)*28, fim=k%2===0&&outras.length>1;
    g+=`<line x1="${x}" x2="${x}" y1="${ly-14}" y2="${y+16}" stroke="var(--ouro)" stroke-width="3" stroke-linecap="round"/>`;
    g+=`<text x="${fim?x-10:x+10}" y="${ly}" text-anchor="${fim?"end":"start"}" font-size="19" font-weight="700" fill="var(--ouro)">${esc(m.rot)} ${pct(m.v)}</text>`;});
  const xv=X(v);
  g+=`<circle cx="${xv}" cy="${y}" r="15" fill="${v<0?"var(--queda)":"var(--ink)"}" stroke="#141c31" stroke-width="4"/>`;
  g+=`<text x="${xv}" y="${y-36}" text-anchor="middle" font-size="24" font-weight="900" fill="var(--ink)">IPCA ${pct(v)}</text>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">${g}</svg>`;
}

/* ===================== matriz região x grupo ===================== */
function matrizSVG(d){
  const W=928, colNome=172, nG=d.grupos.length, cw=(W-colNome)/nG, hh=150, rh=40;
  const linhas=[{nome:"Brasil",valores:Object.fromEntries(d.grupos.map(g=>[g.id,g.atual])),brasil:true},
    ...[...d.matriz].sort((a,b)=>{const pa=(d.regioes.find(r=>r.nome===a.nome)||{}).peso||0,pb=(d.regioes.find(r=>r.nome===b.nome)||{}).peso||0;return pb-pa})];
  const cel=[];d.matriz.forEach(m=>d.grupos.forEach(g=>cel.push({k:m.nome+"|"+g.id,v:m.valores[g.id]})));
  const altas=new Set([...cel].sort((a,b)=>b.v-a.v).slice(0,5).map(c=>c.k));
  const quedas=new Set([...cel].sort((a,b)=>a.v-b.v).slice(0,5).map(c=>c.k));
  const maxAbs=Math.max(...cel.map(c=>Math.abs(c.v)));
  const CURTO={alimentacao:"ALIMENT.",habitacao:"HABIT.",residencia:"RESID.",vestuario:"VEST.",transportes:"TRANSP.",saude:"SAÚDE",despesas:"PESSOAIS",educacao:"EDUC.",comunicacao:"COMUN."};
  const maxPeso=Math.max(...d.grupos.map(g=>g.peso));
  const H=hh+linhas.length*rh+56;
  let g="";
  d.grupos.forEach((gr,j)=>{const cx=colNome+cw*j+cw/2;
    g+=icone(gr.id,cx,30,56);
    g+=`<text x="${cx}" y="88" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1.2" fill="var(--ink-2)">${CURTO[gr.id]||gr.curto.toUpperCase()}</text>`;
    const bw=50; g+=`<rect x="${cx-bw/2}" y="102" width="${bw}" height="5" rx="2.5" fill="rgba(147,172,198,.18)"/><rect x="${cx-bw/2}" y="102" width="${bw*gr.peso/maxPeso}" height="5" rx="2.5" fill="var(--alta)"/>`;
    g+=`<text x="${cx}" y="128" text-anchor="middle" font-size="14" fill="var(--ink-4)">${num(gr.peso,0)}%</text>`;});
  g+=`<text x="10" y="128" font-size="14" letter-spacing="1.2" font-weight="700" fill="var(--ink-4)">PESO NO ÍNDICE</text>`;
  linhas.forEach((l,i)=>{const y=hh+i*rh;
    if(l.brasil) g+=`<rect x="0" y="${y+1}" width="${W}" height="${rh-2}" rx="10" fill="rgba(147,172,198,.16)"/>`;
    g+=`<text x="10" y="${y+rh/2+7}" font-size="19" font-weight="${l.brasil?900:700}" fill="${l.brasil?"var(--ink)":"var(--ink-2)"}">${esc(l.nome)}</text>`;
    d.grupos.forEach((gr,j)=>{const v=l.valores[gr.id], x=colNome+cw*j, k=l.nome+"|"+gr.id;
      if(!l.brasil){const a=Math.min(Math.abs(v)/maxAbs,1);
        g+=`<rect x="${x+3}" y="${y+3}" width="${cw-6}" height="${rh-6}" rx="8" fill="${v<0?`rgba(224,128,114,${(.05+a*.32).toFixed(3)})`:`rgba(147,172,198,${(.04+a*.32).toFixed(3)})`}"/>`;}
      const alta=altas.has(k), queda=quedas.has(k), ext=alta||queda;
      if(ext) g+=`<rect x="${x+3}" y="${y+3}" width="${cw-6}" height="${rh-6}" rx="8" fill="none" stroke="${alta?"var(--alta)":"var(--queda)"}" stroke-width="2.5"/>`;
      const tx=(v<0&&Math.abs(v)>=0.005?"-":"")+num(v);
      g+=`<text x="${x+cw/2}" y="${y+rh/2+7}" text-anchor="middle" font-size="19" font-weight="${l.brasil||ext?800:500}" fill="${v<0&&(l.brasil||ext)?"var(--queda)":(l.brasil||ext?"var(--ink)":"var(--ink-2)")}">${tx}</text>`;
    });
  });
  const ly=hh+linhas.length*rh+36;
  g+=`<rect x="${W-372}" y="${ly-17}" width="24" height="20" rx="6" fill="none" stroke="var(--alta)" stroke-width="2.5"/><text x="${W-338}" y="${ly}" font-size="17" fill="var(--ink-3)">maiores altas</text>`;
  g+=`<rect x="${W-190}" y="${ly-17}" width="24" height="20" rx="6" fill="none" stroke="var(--queda)" stroke-width="2.5"/><text x="${W-156}" y="${ly}" font-size="17" fill="var(--ink-3)">maiores quedas</text>`;
  g+=`<text x="10" y="${ly}" font-size="17" fill="var(--ink-4)">variação em %</text>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ===================== histórico anual ===================== */
function anualSVG(d){
  const r=mesAno(d.referencia), ix=d.indice, W=928, H=660;
  const itens=d.historico_anual.map(h=>({ano:h.ano,v:h.variacao}));
  const parcial=r.m<12, alvo=d.focus&&d.focus.ipca_ano_corrente;
  itens.push({ano:r.ano,v:ix.acumulado_ano,atual:true});
  const vals=itens.map(i=>i.v).concat(parcial&&alvo?[alvo]:[]);
  const media=d.historico_anual.reduce((s,h)=>s+h.variacao,0)/d.historico_anual.length;
  const passo=[1,2,4,5].find(p=>Math.max(...vals)/p<=6)||5;
  const {lo,hi,ticks}=escala(0,Math.max(...vals)+0.8,passo);
  const top=84,bot=70,left=62,right=8, ih=H-top-bot, iw=W-left-right, y=v=>top+(hi-v)/(hi-lo)*ih;
  const n=itens.length, slot=iw/n, bw=Math.min(slot*0.66,34);
  let g="";
  ticks.forEach(t=>{g+=`<line x1="${left}" x2="${W-right}" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?"rgba(178,203,230,.55)":"var(--grid)"}" stroke-width="${t===0?2:1}"/>`;
    g+=`<text x="${left-12}" y="${y(t)+7}" text-anchor="end" font-size="19" fill="var(--ink-4)">${num(t,0)}%</text>`});
  const maxV=Math.max(...d.historico_anual.map(h=>h.variacao));
  itens.forEach((it,k)=>{
    const cx=left+slot*k+slot/2, yv=y(it.v), y0=y(0), h=Math.max(y0-yv,3);
    const destMax=false;
    const fill=it.atual?"var(--alta)":(destMax?"var(--queda)":"var(--alta-fraca)");
    g+=`<rect x="${cx-bw/2}" y="${yv}" width="${bw}" height="${h}" rx="5" fill="${fill}"/>`;
    const yl=(it.atual&&parcial&&alvo)?Math.min(yv,y(alvo))-12:yv-10;
    g+=`<text x="${cx}" y="${yl}" text-anchor="middle" font-size="${it.atual?18:15}" font-weight="${it.atual||destMax?900:700}" fill="${it.atual?"var(--ink)":(destMax?"var(--queda)":"var(--ink-2)")}">${num(it.v,1)}</text>`;
    g+=`<text x="${cx}" y="${H-38}" text-anchor="middle" font-size="16" font-weight="${it.atual?800:500}" fill="${it.atual?"var(--ink)":"var(--ink-3)"}">’${String(it.ano).slice(2)}</text>`;
    if(it.atual&&parcial){
      g+=`<text x="${cx}" y="${H-14}" text-anchor="end" font-size="15" fill="var(--ink-3)" dx="${bw/2+4}">até ${r.curto}</text>`;
      if(alvo){const ya=y(alvo);
        g+=`<line x1="${cx-bw/2-6}" x2="${cx+bw/2+6}" y1="${ya}" y2="${ya}" stroke="var(--ouro)" stroke-width="3" stroke-linecap="round"/>`;
        g+=`<rect x="${cx-bw/2}" y="${ya}" width="${bw}" height="${Math.max(yv-ya,0)}" rx="5" fill="none" stroke="var(--ouro)" stroke-width="1.5" stroke-dasharray="4 4"/>`;}
    }
  });
  g+=`<line x1="${left}" x2="${W-right}" y1="${y(media)}" y2="${y(media)}" stroke="var(--ouro)" stroke-width="2" stroke-dasharray="8 8" opacity=".75"/>`;
  const rot=`média ${d.historico_anual[0].ano} a ${d.historico_anual.at(-1).ano}: ${pct(media)}`, est=rot.length*11.6, xs=W-right-est-18;
  g+=`<line x1="${xs-40}" x2="${xs}" y1="14" y2="14" stroke="var(--ouro)" stroke-width="3" stroke-dasharray="8 6"/>`;
  g+=`<text x="${W-right}" y="21" text-anchor="end" font-size="20" font-weight="700" fill="var(--ouro)">${rot}</text>`;
  if(parcial&&alvo){const rf=`Focus ${r.ano}: ${pct(alvo)}`, xf=W-right-rf.length*10.4-14;
    g+=`<line x1="${xf-30}" x2="${xf}" y1="44" y2="44" stroke="var(--ouro)" stroke-width="3" stroke-linecap="round"/>`;
    g+=`<text x="${W-right}" y="50" text-anchor="end" font-size="18" fill="var(--ink-3)">${rf}</text>`;}
  return {svg:`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`,media};
}

/* ===================== CDI x IPCA + 6% ===================== */
function linhasSVG(c){
  const W=928,H=660, top=40,bot=60,left=78,right=150, s=c.serie, n=s.length;
  const mx=Math.max(...s.map(p=>Math.max(p.cdi,p.ipca6)));
  const passo=[100,200,250,500].find(p=>mx/p<=6)||500;
  const hi=Math.ceil(mx/passo)*passo;
  const X=k=>left+k/(n-1)*(W-left-right), Y=v=>top+(hi-v)/hi*(H-top-bot);
  let g="";
  for(let t=0;t<=hi;t+=passo){g+=`<line x1="${left}" x2="${W-right}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t===0?"rgba(178,203,230,.5)":"var(--grid)"}" stroke-width="${t===0?2:1}"/>`;
    g+=`<text x="${left-14}" y="${Y(t)+7}" text-anchor="end" font-size="19" fill="var(--ink-4)">${t}%</text>`;}
  s.forEach((p,k)=>{const [a,m]=p.mes.split("-");if(m==="01"&&(+a)%4===0){
    g+=`<line x1="${X(k)}" x2="${X(k)}" y1="${H-bot}" y2="${H-bot+8}" stroke="rgba(178,203,230,.5)"/>`;
    g+=`<text x="${X(k)}" y="${H-bot+34}" text-anchor="middle" font-size="19" fill="var(--ink-3)">${a}</text>`;}});
  const path=key=>s.map((p,k)=>`${k?"L":"M"}${X(k).toFixed(1)},${Y(p[key]).toFixed(1)}`).join("");
  const area=key=>path(key)+`L${X(n-1)},${Y(0)}L${X(0)},${Y(0)}Z`;
  g+=`<defs><linearGradient id="gi6" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c9a96e" stop-opacity=".22"/><stop offset="1" stop-color="#c9a96e" stop-opacity="0"/></linearGradient></defs>`;
  g+=`<path d="${area("ipca6")}" fill="url(#gi6)"/>`;
  g+=`<path d="${path("cdi")}" fill="none" stroke="var(--alta)" stroke-width="4" stroke-linejoin="round"/>`;
  g+=`<path d="${path("ipca6")}" fill="none" stroke="var(--ouro)" stroke-width="4" stroke-linejoin="round"/>`;
  const f=s[n-1];
  [["ipca6","IPCA+6%","var(--ouro)"],["cdi","CDI","var(--alta)"]].forEach(([k,rot,cor])=>{
    let yy=Y(f[k]); if(k==="cdi"&&Math.abs(Y(f.cdi)-Y(f.ipca6))<64) yy=Y(f.ipca6)+64;
    g+=`<circle cx="${X(n-1)}" cy="${Y(f[k])}" r="8" fill="${cor}" stroke="#141c31" stroke-width="3"/>`;
    g+=`<text x="${X(n-1)+18}" y="${yy-4}" font-size="20" font-weight="700" fill="${cor}">${rot}</text>`;
    g+=`<text x="${X(n-1)+18}" y="${yy+24}" font-size="25" font-weight="900" fill="var(--ink)">+${num(f[k],1)}%</text>`;});
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

    if(P.intervalo_min!=null&&P.intervalo_max!=null){
      txt+=`, e as estimativas iam de ${B(P.intervalo_min)} a ${B(P.intervalo_max)}${P.fonte_intervalo&&P.fonte_intervalo!==P.fonte_mediana?` (${esc(P.fonte_intervalo)})`:""}. `;
      txt+= ix.variacao<P.intervalo_min?`O dado oficial ficou abaixo até do piso.`:ix.variacao>P.intervalo_max?`O dado oficial ficou acima até do teto.`:`O dado oficial ficou dentro do intervalo.`;
    } else txt+=`. O dado oficial veio ${ix.variacao<P.mediana?"abaixo":ix.variacao>P.mediana?"acima":"em linha"}.`;
    const fontes=[P.fonte_mediana,P.fonte_intervalo,...(P.casas||[]).map(c=>c.nome)].filter(Boolean);
    const titProj= ix.variacao<P.mediana?"Abaixo do esperado":ix.variacao>P.mediana?"Acima do esperado":"Em linha com o esperado";
    S.push(`<section class="slide" data-nome="projecoes">${topo(d,i,"__N__","Comparativo das projeções")}
      <h2>${TIT(d,"projecoes",titProj)}</h2>
      <div class="body"><div class="regua">${regua(d)}</div><p class="proj-txt">${txt}</p></div>
      ${rodape(`Fontes: IBGE, ${[...new Set(fontes)].join(" e ")}.`)}
    </section>`);
  }

  /* últimos 12 meses */
  novo();
  const it12=d.historico_12m.map(h=>({r:`${MES_C[+h.mes.slice(5,7)-1]}/${h.mes.slice(2,4)}`,v:h.variacao}));
  const med12=d.historico_12m.reduce((s,h)=>s+h.variacao,0)/d.historico_12m.length;
  const subiu=ix.acumulado_12m>ix.acumulado_12m_anterior;
  const teto=d.meta&&d.meta.teto, sobreMeta=teto!=null?(ix.acumulado_12m>teto?` Acima do teto da meta (${pct(teto)}).`:` Dentro da meta (teto de ${pct(teto)}).`):"";
  S.push(`<section class="slide" data-nome="doze-meses">${topo(d,i,"__N__")}
    <h2>${TIT(d,"doze","Últimos 12 meses")}</h2>
    <div class="sub">Em 12 meses, a inflação ${subiu?"subiu":"recuou"} para <b>${pct(ix.acumulado_12m)}</b>.${sobreMeta}</div>
    <div class="body">${colunas({itens:it12,media:med12,H:700})}</div>
    ${rodape(`Fonte: IBGE.`)}
  </section>`);

  /* histórico anual */
  if(d.historico_anual&&d.historico_anual.length){
    novo();
    const A=anualSVG(d), a0=d.historico_anual[0].ano, a1=d.historico_anual.at(-1).ano;
    const maxA=d.historico_anual.reduce((m,h)=>h.variacao>m.variacao?h:m), minA=d.historico_anual.reduce((m,h)=>h.variacao<m.variacao?h:m);
    const tit=(d.textos||{}).anual_titulo||`De ${a0} a ${a1}, o IPCA teve média de ${pct(A.media)} ao ano`;
    S.push(`<section class="slide" data-nome="anual">${topo(d,i,"__N__")}
      <h2>${TIT(d,"anual","Inflação ano a ano")}</h2>
      <div class="sub">Média de <b>${pct(A.media)}</b> ao ano entre ${a0} e ${a1}, com pico de ${pct(maxA.variacao)} em ${maxA.ano}.</div>
      <div class="body">${A.svg}</div>
      ${rodape(`Fontes: IBGE${r.m<12?" e Banco Central (Focus)":""}.`)}
    </section>`);
  }

  /* CDI x IPCA + 6% */
  if(d.cdi_ipca6&&d.cdi_ipca6.serie&&d.cdi_ipca6.serie.length){
    novo();
    const c=d.cdi_ipca6, f=c.serie.at(-1), anos=Math.round(c.serie.length/12);
    const ini=mesAno(c.serie[0].mes), fim=mesAno(c.serie.at(-1).mes);
    S.push(`<section class="slide" data-nome="cdi-ipca6">${topo(d,i,"__N__","Comparador de ativos")}
      <h2>${TIT(d,"cdi",`IPCA+6% e CDI em ${anos} anos`)}</h2>
      <div class="sub">IPCA+6% acumulou <b>${num(f.ipca6,1)}%</b> e o CDI, <b>${num(f.cdi,1)}%</b>.</div>
      <div class="body">${linhasSVG(c)}</div>
      ${rodape(`${cap(ini.curto)}/${ini.ano} a ${fim.curto}/${fim.ano}, sem impostos e custos. Rentabilidade passada não garante resultado futuro. Fontes: BCB e IBGE.`)}
    </section>`);
  }

  /* contribuição */
  novo();
  const pMax=Math.max(...d.grupos.map(g=>g.peso));
  const contrib=d.grupos.map(g=>({nome:g.curto,icone:g.id,peso:g.peso,pesoMax:pMax,v:g.peso*g.atual/100,extra:`variação ${pct(g.atual)}`})).sort((a,b)=>a.v-b.v);
  S.push(`<section class="slide" data-nome="contribuicao">${topo(d,i,"__N__")}
    <h2>${TIT(d,"contribuicao","Impacto de cada grupo")}</h2>
    <div class="sub">${esc(t.contribuicao_titulo)}.</div>
    <div class="body">${barrasH({linhas:contrib,rowH:86,colNome:300,colVal:240,formato:v=>pct(v,2,true)})}</div>
    ${rodape(`Impacto aproximado: variação do grupo × peso no índice. Fonte: IBGE.`)}
  </section>`);

  /* grupo a grupo */
  novo();
  const ant=mesAno(d.historico_12m[d.historico_12m.length-2].mes).mes;
  const gl=[...d.grupos].sort((a,b)=>b.peso-a.peso).map(g=>({nome:g.curto,icone:g.id,peso:g.peso,pesoMax:Math.max(...d.grupos.map(x=>x.peso)),v:g.atual,m:g.anterior,extra:`${ant}: ${pct(g.anterior)}`}));
  S.push(`<section class="slide" data-nome="grupos">${topo(d,i,"__N__")}
    <h2>${TIT(d,"grupos","Grupo a grupo")}</h2>
    <div class="sub">${esc(t.grupos_titulo)}. O traço dourado marca ${ant}.</div>
    <div class="body">${barrasH({linhas:gl,rowH:88,colNome:300,colVal:200,marcador:true})}</div>
    ${rodape(`Fonte: IBGE.`)}
  </section>`);

  /* regiões */
  novo();
  const rmax=d.regioes.reduce((m,x)=>x.atual>m.atual?x:m), rmin=d.regioes.reduce((m,x)=>x.atual<m.atual?x:m);
  const rl=[{nome:"Brasil",v:ix.variacao,extra:pct(ix.acumulado_12m),destaque:true},
    ...d.regioes.map(x=>({nome:`${x.nome} (${x.uf})`,v:x.atual,extra:pct(x.acumulado_12m)}))].sort((a,b)=>b.v-a.v);
  S.push(`<section class="slide" data-nome="regioes">${topo(d,i,"__N__")}
    <h2>${TIT(d,"regioes","Por região")}</h2>
    <div class="body">${barrasH({linhas:rl,rowH:46,colNome:330,colVal:300,extraAoLado:150,cab:[{x:928-6-150,t:r.mes.toUpperCase()},{x:922,t:"12 MESES"}]})}</div>
    ${rodape(`Fonte: IBGE.`)}
  </section>`);

  /* matriz */
  if(d.matriz){
    novo();
    S.push(`<section class="slide" data-nome="matriz">${topo(d,i,"__N__")}
      <h2>${TIT(d,"matriz","Região × grupo")}</h2>
      <div class="body">${matrizSVG(d)}</div>
      ${rodape(`Fonte: IBGE.`)}
    </section>`);
  }

  /* história */
  novo();
  const ih=[...d.mesmo_mes_anos_anteriores.map(h=>({r:`${r.curto}/${String(h.ano).slice(2)}`,v:h.variacao})),{r:`${r.curto}/${String(r.ano).slice(2)}`,v:ix.variacao}];
  const h0=d.mesmo_mes_anos_anteriores[0].ano, h1=d.mesmo_mes_anos_anteriores.at(-1).ano;
  S.push(`<section class="slide" data-nome="historia">${topo(d,i,"__N__")}
    <h2>${TIT(d,"historia",cap(r.mes)+" na história")}</h2>
    <div class="sub">${esc(t.historia_titulo)}. Média de ${pct(t._media)} entre ${h0} e ${h1}.</div>
    <div class="body">${colunas({itens:ih,media:t._media,H:700,rotMedia:`média ${h0} a ${h1}`})}</div>
    ${rodape(`Fonte: IBGE.`)}
  </section>`);

  /* expectativas */
  novo();
  const alvo=d.focus.ipca_ano_corrente, prog=Math.min(ix.acumulado_ano/alvo,1);
  const fa=d.focus.anos, fant=d.focus.ipca_ano_corrente_anterior;
  const varSemana=fant==null?"":(Math.abs(fant-alvo)<0.005?", estável em relação à semana anterior":`, ante ${pct(fant)} na semana anterior`);
  const colsFocus=colunas({itens:fa.map(a=>({r:String(a.ano),v:a.ipca})),W:928,H:330,destaqueUltimo:false});
  S.push(`<section class="slide" data-nome="expectativas">${topo(d,i,"__N__")}
    <h2>${TIT(d,"expectativas","Boletim Focus")}</h2>
    <div class="sub">${esc(t.expectativas_titulo)} (boletim de ${dataBR(d.focus.boletim_publicado||d.focus.boletim)}).</div>
    <div class="body">
      ${t._faltamMeses>0?`
      <div class="trilho-wrap">
        <div class="trilho-rot"><span>Acumulado no ano: <b style="color:var(--ink)">${pct(ix.acumulado_ano)}</b></span><span>Focus ${r.ano}: <b style="color:var(--ouro)">${pct(alvo)}</b></span></div>
        <svg width="928" height="40" viewBox="0 0 928 40">
          <rect x="0" y="10" width="928" height="20" rx="10" fill="rgba(147,172,198,.16)"/>
          <rect x="0" y="10" width="${928*prog}" height="20" rx="10" fill="var(--alta)"/>
          <line x1="926" x2="926" y1="0" y2="40" stroke="var(--ouro)" stroke-width="3"/>
        </svg>
      </div>
      <div class="cards2">
        <div class="stat"><div class="rot">Falta até dezembro</div><div class="val">${pct(t._falta)}</div><div class="nota">em ${t._faltamMeses} ${t._faltamMeses>1?"meses":"mês"}, para fechar no Focus</div></div>
        <div class="stat"><div class="rot">Ritmo necessário</div><div class="val">${pct(t._mensal)}</div><div class="nota">por mês, em média, por composição</div></div>
      </div>`:""}
      <div style="margin-top:52px;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700">Projeção do Focus por ano</div>
      <div style="margin-top:8px">${colsFocus}</div>
    </div>
    ${rodape(`Fontes: IBGE e Banco Central (Focus). Projeções não são garantia de resultado.`)}
  </section>`);

  /* fechamento */
  novo();
  S.push(`<section class="slide" data-nome="fechamento">${topo(d,i,"__N__","Maison Invest")}
    <div class="fecho-main">
      <div class="fecho-kicker">Índice Nacional de Preços ao Consumidor Amplo</div>
      <div class="fecho-titulo">IPCA</div>
      <div class="fecho-texto">É a inflação oficial do Brasil, apurada mensalmente pelo IBGE. Mede a variação de preços de uma cesta de bens e serviços consumidos por famílias com renda de 1 a 40 salários mínimos, em 16 regiões do país, e serve de referência para a meta de inflação perseguida pelo Banco Central.</div>
      <div class="cta">Salve e compare no próximo mês <svg width="34" height="16" viewBox="0 0 34 16"><path d="M0 8h30M24 2l7 6-7 6" stroke="#c9a96e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="fecho-base">
      <div class="linha"><div class="lema">Liberdade nas escolhas.<br>Fraternidade na relação.<br>Expertise na solução.</div><img class="logo" src="${LOGO}" alt="Maison Invest e XP Investimentos"></div>
      <div class="legal">Conteúdo educativo, sem recomendação de investimento. Fontes: IBGE e Banco Central.</div>
    </div>
  </section>`);

  const N=String(S.length).padStart(2,"0");
  document.getElementById("deck").innerHTML=S.map((x,k)=>x.replaceAll("__N__",N).replace(/data-nome="([^"]+)"/,`data-nome="${String(k+1).padStart(2,"0")}-$1"`)).join("");
  return S.length;
}
window.render=render;
</script>
<script>
/* Dados embutidos para pré-visualização. O script de render substitui por outro mês. */
window.IPCA_DADOS = __DADOS__;
if(window.IPCA_DADOS) render(window.IPCA_DADOS);
</script>
</body>
</html>
